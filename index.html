let lastS=-1,lastC=-1,lastH=-1,lastL='';
const chipShield=$('chip-shield'),chipSlow=$('chip-slow'),chipMag=$('chip-magnet'),chipDash=$('chip-dash');
function refreshHUD(){
  const s=Math.floor(score);
  if(s!==lastS){elScore.textContent=s;lastS=s;}
  if(coinsBank!==lastC){elCoins.textContent=coinsBank;lastC=coinsBank;}
  if(player.hearts!==lastH){renderHearts();lastH=player.hearts;}
  let lt,bar;
  if(mode==='campaign'){
    lt='LV '+level+' · '+diff.name+(diff.boss?' · BOSS':'');
    bar=diff.boss?(boss?boss.hp/boss.maxHp:1):(exitOpen?1:clamp(elapsed/diff.need,0,1));
  }else{
    lt='WAVE '+level+' · '+diff.name;
    bar=(elapsed%30)/30;
  }
  if(lt!==lastL){elLevel.textContent=lt;elLevel.style.color=diff.color;lastL=lt;}
  elFill.style.width=(bar*100).toFixed(1)+'%';
  chipShield.style.display=player.shield?'flex':'none';
  chipSlow.style.display=player.slowT>0?'flex':'none';
  chipMag.style.display=player.magnetT>0?'flex':'none';
  chipDash.style.display=player.dashT>0?'flex':'none';
  $('bar-slow').style.transform='scaleX('+(player.slowT/3).toFixed(2)+')';
  $('bar-magnet').style.transform='scaleX('+(player.magnetT/6).toFixed(2)+')';
  $('bar-dash').style.transform='scaleX('+(player.dashT/3.5).toFixed(2)+')';
}

}
let toastTimer;
function toast(msg){
  const el=$('toast');el.textContent=msg;el.classList.add('on');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),1700);
}
function updateHomeStats(){
  $('home-best').textContent=best;
  $('home-coins').textContent=coinsBank;
  $('home-stars').textContent=totalStars()+'/'+(MAXLV*3);
}
function resetRun(){
  clearEntities();
  elapsed=0;score=0;runCoins=0;dodged=0;damageTaken=0;newBest=false;
  goShown=false;coinCombo=0;shake=0;flashA=0;hitstop=0;hbT=0;
  tMet=1;tWall=5;tLas=4;tBH=1;tFZ=7;tCoin=2.2;tPup=9;tBnc=2;tOrb=3;tTur=3;
  lastMX=null;lastCount=99;
  quakeT=3.5;quakeState='idle';
  conv={dir:Math.random()<0.5?-1:1,t:0,warn:0};
  player.reset();
  document.body.classList.add('ingame');
  renderHearts();lastH=-1;lastL='';
  setMusic(true);
}
function startLevel(n){
  mode='campaign';level=clamp(n,1,MAXLV);
  diff=buildDiff();
  resetRun();
  exitOpen=false;
  exitX=rand(playX+90,playX+playW-90);
  if(diff.boss)boss=new Boss(diff.boss);
  if(diff.fog)for(let i=0;i<diff.fog.max;i++)fogs.push(new FogBlob(true));
  state='playing';
  hideScreens();
  music.bpm=Math.min(200,96+(n-1)*3+(diff.boss?26:0));
  if(diff.boss){showBanner('WARNING',diff.name,'#ff3860');sfx.alarm();}
  else showBanner('LEVEL '+n,diff.name,diff.color);
}
function startEndless(){
  mode='endless';level=1;
  diff=buildDiff();
  resetRun();
  state='playing';
  hideScreens();
  music.bpm=96;
  showBanner('WAVE 1','ASTEROIDS','#40e8ff');
}
function retryRun(){
  if(mode==='campaign')startLevel(level);
  else startEndless();
}
function pauseGame(){
  if(state!=='playing')return;
  state='paused';
  $('ps-score').textContent=Math.floor(score);
  $('ps-time').textContent=fmtTime(elapsed);
  showScreen(scrPause);
}
function resumeGame(){state='playing';hideScreens();}
let starTimers=[];
function showClearStars(n){
  starTimers.forEach(clearTimeout);starTimers=[];
  const els=document.querySelectorAll('#clear-stars .st');
  els.forEach(e=>e.classList.remove('earned'));
  for(let i=0;i<n;i++){
    starTimers.push(setTimeout(()=>{
      els[i].classList.add('earned');
      sfx.coin(880+i*220);
    },500+i*380));
  }
}
function levelClear(){
  if(state!=='playing')return;
  state='clear';
  const stars=damageTaken===0?3:damageTaken===1?2:1;
  const bonus=10+level*4+stars*15+(diff.boss?60:0);
  coinsBank+=bonus;runCoins+=bonus;
  store.set('dtc_coins',coinsBank);
  starsMap[level]=Math.max(starsMap[level]||0,stars);
  store.set('dtc_stars',starsMap);
  if(level>=progress&&level<MAXLV){progress=level+1;store.set('dtc_progress',progress);}
  document.body.classList.remove('ingame');
  $('clear-title').textContent=level>=MAXLV?'GAME COMPLETE!':(diff.boss?'BOSS DEFEATED!':'LEVEL CLEAR');
  $('clear-sub').textContent=level>=MAXLV?'ALL 20 LEVELS CONQUERED':diff.name+' COMPLETE';
  $('cl-time').textContent=fmtTime(elapsed);
  $('cl-dodge').textContent=dodged;
  $('cl-coins').textContent='+'+runCoins;
  $('btn-next').style.display=level<MAXLV?'':'none';
  sfx.fanfare();
  burst(boss?boss.x:(exitOpen?exitX:player.x),boss?boss.y:150,'#40e8ff',30,380,0.8,3);
  showScreen(scrClear);
  showClearStars(stars);
}
function showGameOver(){
  state='over';setMusic(false);
  let isBest=false;
  if(mode==='endless'&&Math.floor(score)>best){
    best=Math.floor(score);isBest=true;store.set('dtc_best',best);
  }
  $('over-sub').textContent=mode==='campaign'
    ?'LEVEL '+level+' · '+diff.name
    :'SURVIVAL RUN · WAVE '+level;
  $('over-newbest').classList.toggle('on',isBest);
  $('over-score').textContent=Math.floor(score);
  $('st-surv').textContent=fmtTime(elapsed);
  $('st-dodge').textContent=dodged;
  $('st-coins').textContent='+'+runCoins;
  $('st-best').textContent=best;
  $('st-best-row').style.display=mode==='endless'?'':'none';
  $('btn-again').textContent=mode==='campaign'?'RETRY LEVEL':'PLAY AGAIN';
  document.body.classList.remove('ingame');
  sfx.gameover();
  showScreen(scrOver);
}
function gotoMenu(){
  state='menu';diff=null;
  clearEntities();
  document.body.classList.remove('ingame');
  updateHomeStats();
  setMusic(true);music.bpm=84;
  showScreen(scrHome);
}

/* ================= Level select ================= */
const STARP='M12 2.2l2.8 6 6.6.6-5 4.3 1.5 6.4L12 16.6 6.1 19.5l1.5-6.4-5-4.3 6.6-.6z';
function starSVG(on){
  return '<svg viewBox="0 0 24 24"><path d="'+STARP+'" fill="'+(on?'#ffc857':'none')+'" stroke="'+(on?'#ffc857':'rgba(114,133,168,.5)')+'" stroke-width="1.6"/></svg>';
}
const LOCKSVG='<svg viewBox="0 0 24 24" fill="none" stroke="#7285a8" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
function buildSelect(){
  $('sel-stars').textContent=totalStars()+'/'+(MAXLV*3);
  const grid=$('level-grid');
  grid.innerHTML='';
  for(let n=1;n<=MAXLV;n++){
    const L=LEVELS[n-1];
    const unlocked=n<=progress;
    const isBoss=!!L.boss;
    const tile=document.createElement('button');
    tile.className='lv-tile'+(unlocked?'':' locked')+(isBoss?' boss':'');
    tile.style.setProperty('--tc',isBoss?'#ff3860':L.color);
    tile.title=L.name+' — '+L.sub;
    let html='<span class="lv-num">'+n+'</span>';
    html+='<span class="lv-name">'+(isBoss?'BOSS':L.name)+'</span>';
    if(unlocked){
      const st=starsMap[n]||0;
      let sr='';
      for(let i=0;i<3;i++)sr+=starSVG(i<st);
      html+='<span class="lv-stars">'+sr+'</span>';
    }else{
      html+='<span class="lv-stars">'+LOCKSVG+'</span>';
    }
    tile.innerHTML=html;
    tile.addEventListener('click',()=>{
      if(!unlocked){sfx.err();toast('COMPLETE LEVEL '+(n-1)+' FIRST');return;}
      sfx.click();startLevel(n);
    });
    grid.appendChild(tile);
  }
}

/* ================= Shop ================= */
let shopFrom=scrHome;
const shopPreviews=[];
function openShop(from){
  shopFrom=from;
  buildShop();
  showScreen(scrShop);
}
function buildShop(){
  shopPreviews.length=0;
  $('shop-coins').textContent=coinsBank;
  const list=$('char-list');
  list.innerHTML='';
  for(const ch of CHARS){
    const isOwned=owned.has(ch.id),isEq=charId===ch.id;
    const row=document.createElement('div');
    row.className='char-row'+(isEq?' equipped':'');
    const cvp=document.createElement('canvas');
    cvp.className='char-preview';cvp.width=64*DPR;cvp.height=64*DPR;
    const info=document.createElement('div');
    info.className='char-info';
    info.innerHTML='<div class="char-name">'+ch.name+'</div><div class="char-desc">'+ch.desc+'</div>';
    const btn=document.createElement('button');
    if(isEq){btn.className='btn small ghost';btn.textContent='EQUIPPED';btn.disabled=true;}
    else if(isOwned){btn.className='btn small';btn.textContent='SELECT';}
    else{
      btn.className='btn small char-buy';
      btn.innerHTML=ch.cost+' <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="2.6"/><circle cx="12" cy="12" r="3.4" fill="currentColor"/></svg>';
    }
    btn.addEventListener('click',e=>{
      e.currentTarget.blur();
      if(isEq)return;
      if(isOwned){
        charId=ch.id;store.set('dtc_char',charId);sfx.click();buildShop();
      }else if(coinsBank>=ch.cost){
        coinsBank-=ch.cost;owned.add(ch.id);charId=ch.id;
        store.set('dtc_coins',coinsBank);
        store.set('dtc_owned',[...owned]);
        store.set('dtc_char',charId);
        sfx.power();toast(ch.name+' UNLOCKED');buildShop();
      }else{
        sfx.err();toast('NOT ENOUGH COINS');
      }
    });
    row.appendChild(cvp);row.appendChild(info);row.appendChild(btn);
    list.appendChild(row);
    const g=cvp.getContext('2d');
    g.setTransform(DPR,0,0,DPR,0,0);
    shopPreviews.push({g:g,id:ch.id});
  }
}
function drawShopPreviews(t){
  for(let i=0;i<shopPreviews.length;i++){
    const p=shopPreviews[i];
    p.g.clearRect(0,0,64,64);
    p.g.save();p.g.translate(32,34+Math.sin(t*2.2+i)*2);
    drawChar(p.g,p.id,17,t,0,0);p.g.restore();
  }
}

/* ================= UI bindings ================= */
function bindUI(){
  $('btn-campaign').addEventListener('click',e=>{e.currentTarget.blur();sfx.click();buildSelect();state='select';showScreen(scrSelect);});
  $('btn-endless').addEventListener('click',e=>{e.currentTarget.blur();sfx.click();startEndless();});
  $('btn-shop').addEventListener('click',e=>{e.currentTarget.blur();sfx.click();openShop(scrHome);});
  $('btn-sound').addEventListener('click',e=>{e.currentTarget.blur();toggleMute();});
  $('sel-back').addEventListener('click',e=>{e.currentTarget.blur();sfx.click();state='menu';showScreen(scrHome);});
  $('btn-next').addEventListener('click',e=>{e.currentTarget.blur();sfx.click();if(level<MAXLV)startLevel(level+1);});
  $('btn-replay').addEventListener('click',e=>{e.currentTarget.blur();sfx.click();startLevel(level);});
  $('cl-menu').addEventListener('click',e=>{e.currentTarget.blur();sfx.click();gotoMenu();});
  $('btn-again').addEventListener('click',e=>{e.currentTarget.blur();sfx.click();retryRun();});
  $('btn-shop2').addEventListener('click',e=>{e.currentTarget.blur();sfx.click();openShop(scrOver);});
  $('btn-menu').addEventListener('click',e=>{e.currentTarget.blur();sfx.click();gotoMenu();});
  $('btn-pause').addEventListener('click',e=>{
    e.currentTarget.blur();
    if(state==='playing')pauseGame();
    else if(state==='paused')resumeGame();
  });
  $('btn-mute').addEventListener('click',e=>{e.currentTarget.blur();toggleMute();});
  $('btn-resume').addEventListener('click',e=>{e.currentTarget.blur();sfx.click();resumeGame();});
  $('btn-restart').addEventListener('click',e=>{e.currentTarget.blur();sfx.click();retryRun();});
  $('btn-quit').addEventListener('click',e=>{e.currentTarget.blur();sfx.click();gotoMenu();});
  $('shop-back').addEventListener('click',e=>{
    e.currentTarget.blur();sfx.click();
    showScreen(shopFrom);
    if(shopFrom===scrHome)updateHomeStats();
  });
  window.addEventListener('blur',()=>{if(state==='playing')pauseGame();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pauseGame();});
}

/* ================= Main loop ================= */
let last=performance.now(),errCount=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;
  if(dt>0.1)dt=0.1;
  try{
    update(dt);
    updateLoops();
    render(now/1000);
    if(scrShop.classList.contains('on'))drawShopPreviews(now/1000);
    if(state==='playing'||state==='dying')refreshHUD();
    errCount=0;
  }catch(e){
    if(++errCount<5)console.error(e);
  }
}

/* ================= Init ================= */
resize();
player.reset();
applyMute();
updateHomeStats();
renderHearts();
bindUI();
requestAnimationFrame(frame);
</script>
