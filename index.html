<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dodge the Chaos</title>
<meta name="description" content="Dodge the Chaos — 20 unique levels of pure survival.">
<meta name="theme-color" content="#05070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dodge the Chaos">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%2340e8ff'/><rect x='30' y='40' width='40' height='14' rx='7' fill='%2306333b'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070f; --cy:#40e8ff; --danger:#ff3860; --gold:#ffc857;
  --green:#3dffa0; --violet:#c264ff; --text:#dfe9ff; --muted:#7285a8;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:'Chakra Petch',sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;font-family:inherit}
#game{position:fixed;inset:0;display:block;touch-action:none;z-index:1}
#scanlines{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 4px)}
#vig{position:fixed;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.5) 100%)}
#fx-slow{position:fixed;inset:0;z-index:3;pointer-events:none;background:rgba(70,140,255,.09);opacity:0;transition:opacity .25s}
#fx-slow.on{opacity:1}
#fx-lowhp{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .4s;
  box-shadow:inset 0 0 90px 30px rgba(255,20,60,.35)}
#fx-lowhp.on{animation:lowpulse 1s infinite alternate}
@keyframes lowpulse{from{opacity:.4}to{opacity:1}}
#fx-flash{position:fixed;inset:0;z-index:12;pointer-events:none;opacity:0}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:4;pointer-events:none;display:none;
  padding:calc(10px + env(safe-area-inset-top)) 14px 0 14px}
body.ingame #hud{display:block}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start}
.hud-label{font-size:10px;letter-spacing:3px;color:var(--muted)}
#hud-score{font-family:'Press Start 2P',monospace;font-size:clamp(16px,4.5vw,24px);color:var(--cy);margin-top:4px}
.hud-coins{display:flex;align-items:center;gap:5px;margin-top:7px;color:var(--gold);font-weight:700;font-size:15px}
.hud-coins svg{width:14px;height:14px}
.hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#hearts{display:flex;gap:4px;justify-content:flex-end}
#hearts .h{width:21px;height:21px}
#hearts .h.full path{fill:var(--danger)}
#hearts .h.empty path{fill:none;stroke:rgba(255,56,96,.32);stroke-width:1.6}
.hud-btns{display:flex;gap:8px;pointer-events:auto}
.icon-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:rgba(8,14,28,.7);
  border:1px solid rgba(64,232,255,.3);color:var(--cy);cursor:pointer;transition:.15s}
.icon-btn:hover{background:rgba(64,232,255,.15)}
.icon-btn svg{width:17px;height:17px}
.hud-level{display:flex;align-items:center;gap:10px;margin-top:10px}
#hud-level{font-size:10px;letter-spacing:2.5px;color:var(--muted);white-space:nowrap;font-weight:700}
.lv-bar{flex:1;height:3px;background:rgba(64,232,255,.12);overflow:hidden}
#lv-fill{height:100%;width:0;background:var(--cy)}
#pup-row{position:fixed;top:calc(118px + env(safe-area-inset-top));left:14px;z-index:4;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.pup-chip{display:none;align-items:center;gap:7px;background:rgba(8,14,28,.75);border:1px solid rgba(255,255,255,.1);padding:5px 8px}
.pup-chip svg{width:13px;height:13px}
.chip-bar{display:block;width:26px;height:3px;background:rgba(255,255,255,.12);overflow:hidden}
.chip-bar i{display:block;height:100%;background:currentColor;transform-origin:left}

/* Screens */
.screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:rgba(4,7,15,.66);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .25s}
.screen.on{opacity:1;pointer-events:auto}
.panel{position:relative;background:rgba(9,15,30,.94);border:1px solid rgba(64,232,255,.22);
  padding:30px 34px;width:min(92vw,420px);max-height:88vh;overflow-y:auto}
.panel.wide{width:min(92vw,560px)}
.cnr{position:absolute;width:13px;height:13px;border:2px solid var(--cy)}
.cnr.tl{top:-2px;left:-2px;border-right:none;border-bottom:none}
.cnr.tr{top:-2px;right:-2px;border-left:none;border-bottom:none}
.cnr.bl{bottom:-2px;left:-2px;border-right:none;border-top:none}
.cnr.br{bottom:-2px;right:-2px;border-left:none;border-top:none}
.btn{font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:1px;color:var(--cy);
  background:transparent;border:1px solid rgba(64,232,255,.55);padding:14px 20px;cursor:pointer;
  transition:background .15s,transform .1s}
.btn:hover{background:rgba(64,232,255,.13)}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--cy);color:#04121c;border-color:var(--cy)}
.btn.primary:hover{background:#8ff4ff}
.btn.big{width:100%;padding:17px 20px;font-size:13px}
.btn.small{padding:10px 14px;font-size:9px}
.btn.ghost{color:var(--muted);border-color:rgba(114,133,168,.4)}
.btn.ghost:hover{background:rgba(114,133,168,.12)}
.home-row{display:flex;gap:10px}
.home-row .btn{flex:1}

/* HOME */
.home-wrap{display:flex;flex-direction:column;align-items:center;padding:20px;text-align:center}
.logo{line-height:1}
.logo-top{font-family:'Press Start 2P',monospace;font-size:clamp(34px,11vw,62px);color:var(--cy);
  text-shadow:3px 0 rgba(255,45,120,.45),-3px 0 rgba(64,232,255,.4);
  animation:glitch 3.4s infinite steps(1)}
.logo-bot{font-family:'Press Start 2P',monospace;font-size:clamp(15px,4.6vw,26px);color:var(--danger);margin-top:12px;letter-spacing:4px}
.logo-bot span{color:var(--muted);font-size:.62em;vertical-align:.18em;letter-spacing:2px}
@keyframes glitch{0%,90%,100%{transform:none}92%{transform:translate(3px,-2px)}94%{transform:translate(-3px,1px)}96%{transform:translate(2px,0)}}
.tagline{margin-top:18px;font-size:11px;letter-spacing:5px;color:var(--muted);font-weight:600}
.home-stats{display:flex;align-items:center;gap:16px;margin:24px 0 28px}
.hs{display:flex;flex-direction:column;gap:4px}
.hs-l{font-size:9px;letter-spacing:3px;color:var(--muted)}
.hs-v{font-family:'Press Start 2P',monospace;font-size:14px;color:var(--text)}
.hs-v.gold{color:var(--gold)}
.hs-div{width:1px;height:34px;background:rgba(114,133,168,.3)}
.home-col{display:flex;flex-direction:column;gap:12px;width:min(78vw,320px)}
.home-hint{margin-top:26px;font-size:10px;letter-spacing:2px;color:var(--muted);line-height:2}
.home-hint b{color:var(--cy);font-weight:600}

/* LEVEL SELECT */
.shop-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.shop-title{font-family:'Press Start 2P',monospace;font-size:15px;color:var(--cy)}
.shop-balance{display:flex;align-items:center;gap:6px;color:var(--gold);font-weight:700;font-size:15px}
.shop-balance svg{width:14px;height:14px}
#level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv-tile{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:rgba(8,14,28,.8);border:1px solid var(--tc,rgba(64,232,255,.4));cursor:pointer;transition:.15s;padding:2px}
.lv-tile:hover{background:rgba(64,232,255,.12)}
.lv-tile .lv-num{font-family:'Press Start 2P',monospace;font-size:12px;color:var(--text)}
.lv-tile .lv-name{font-size:6.5px;letter-spacing:.4px;color:var(--muted);text-align:center;line-height:1.15;min-height:15px}
.lv-tile .lv-stars{display:flex;gap:1px}
.lv-tile .lv-stars svg{width:9px;height:9px}
.lv-tile .lv-boss{font-size:7px;letter-spacing:2px;color:#ff3860;font-weight:700}
.lv-tile.locked{border-color:rgba(114,133,168,.25);opacity:.4;cursor:not-allowed}
.lv-tile.locked:hover{background:rgba(8,14,28,.8)}
.lv-tile.boss{background:rgba(40,6,18,.85)}
.lv-tile.boss .lv-num{color:#ff3860}

/* SHOP */
#char-list{display:flex;flex-direction:column}
.char-row{display:flex;align-items:center;gap:14px;padding:13px 6px;border-bottom:1px solid rgba(64,232,255,.1)}
.char-row:last-child{border-bottom:none}
.char-row.equipped{background:rgba(64,232,255,.05)}
.char-preview{width:64px;height:64px;flex-shrink:0;background:rgba(5,9,20,.8);border:1px solid rgba(64,232,255,.15)}
.char-info{flex:1;min-width:0}
.char-name{font-family:'Press Start 2P',monospace;font-size:10px;color:var(--text);letter-spacing:1px}
.char-desc{font-size:11px;color:var(--muted);margin-top:6px}
.char-buy{display:flex;align-items:center;gap:5px;justify-content:center}
.char-buy svg{width:11px;height:11px}
.shop-hint{margin-top:16px;font-size:10px;letter-spacing:2px;color:var(--muted);text-align:center}

/* CLEAR */
#clear-title{font-family:'Press Start 2P',monospace;font-size:clamp(16px,5.4vw,24px);color:var(--cy);text-align:center;
  text-shadow:2px 0 rgba(255,45,120,.35),-2px 0 rgba(64,232,255,.3)}
#clear-sub{margin-top:12px;text-align:center;font-size:10px;letter-spacing:4px;color:var(--muted);font-weight:700}
#clear-stars{display:flex;justify-content:center;gap:14px;margin:22px 0 4px}
#clear-stars .st{width:52px;height:52px}
#clear-stars .st path{fill:none;stroke:rgba(114,133,168,.4);stroke-width:1.4}
#clear-stars .st.earned path{fill:var(--gold);stroke:var(--gold)}
#clear-stars .st.earned{animation:starpop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
.stats{margin:16px 0 22px}
.strow{display:flex;align-items:baseline;gap:10px;margin:9px 0;font-size:14px}
.strow .lbl{color:var(--muted);letter-spacing:2.5px;font-size:10px}
.strow .dots{flex:1;border-bottom:1px dotted rgba(114,133,168,.4);transform:translateY(-4px)}
.strow .val{font-weight:700;font-size:15px}
.strow .val.gold{color:var(--gold)}

/* GAME OVER */
.over-title{font-family:'Press Start 2P',monospace;font-size:clamp(19px,6vw,28px);color:var(--danger);text-align:center;
  text-shadow:2px 0 rgba(64,232,255,.35),-2px 0 rgba(255,255,255,.15)}
#over-sub{margin-top:12px;text-align:center;font-size:10px;letter-spacing:4px;color:var(--muted);font-weight:700}
#over-newbest{display:none;margin:14px 0 0;text-align:center;font-family:'Press Start 2P',monospace;font-size:10px;
  color:var(--gold);letter-spacing:2px;animation:opulse 1s infinite alternate}
#over-newbest.on{display:block}
@keyframes opulse{from{opacity:.55}to{opacity:1}}
#over-score{font-family:'Press Start 2P',monospace;font-size:clamp(30px,9vw,44px);color:var(--cy);text-align:center;margin:18px 0 4px}
.over-score-l{text-align:center;font-size:9px;letter-spacing:4px;color:var(--muted)}

/* PAUSE / banner / toast */
.p-title{font-family:'Press Start 2P',monospace;font-size:20px;color:var(--cy);text-align:center}
.pause-stats{text-align:center;color:var(--muted);font-size:12px;letter-spacing:2px;margin:14px 0 22px}
.pause-stats b{color:var(--text)}
.pause-stats .dot{margin:0 8px}
#screen-pause .btn{width:100%;margin-bottom:10px}
#screen-pause .home-row .btn{margin-bottom:0}
#banner{position:fixed;top:34%;left:50%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;text-align:center;opacity:0}
#banner.show{animation:bAnim 1.9s ease forwards}
@keyframes bAnim{0%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}14%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  72%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.94)}}
#banner-lv{font-family:'Press Start 2P',monospace;font-size:clamp(22px,6.6vw,38px);color:var(--cy);
  text-shadow:3px 0 rgba(255,45,120,.4),-3px 0 rgba(64,232,255,.35)}
#banner-name{font-size:12px;letter-spacing:7px;color:var(--danger);margin-top:12px;font-weight:700}
#toast{position:fixed;bottom:36px;left:50%;transform:translate(-50%,14px);z-index:20;pointer-events:none;
  background:rgba(9,15,30,.95);border:1px solid rgba(255,56,96,.5);color:var(--text);
  padding:11px 20px;font-size:12px;letter-spacing:2px;opacity:0;transition:.25s}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:480px){.panel{padding:24px 20px}.char-preview{width:54px;height:54px}}
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="scanlines"></div>
<div id="vig"></div>
<div id="fx-slow"></div>
<div id="fx-lowhp"></div>
<div id="fx-flash"></div>

<div id="hud">
  <div class="hud-top">
    <div>
      <div class="hud-label">SCORE</div>
      <div id="hud-score">0</div>
      <div class="hud-coins">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="2.6"/><circle cx="12" cy="12" r="3.4" fill="currentColor"/></svg>
        <span id="hud-coins">0</span>
      </div>
    </div>
    <div class="hud-right">
      <div id="hearts"></div>
      <div class="hud-btns">
        <button class="icon-btn" id="btn-pause" title="Pause (P)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M9 5v14M15 5v14"/></svg>
        </button>
        <button class="icon-btn" id="btn-mute" title="Sound (M)"></button>
      </div>
    </div>
  </div>
  <div class="hud-level">
    <span id="hud-level"></span>
    <div class="lv-bar"><div id="lv-fill"></div></div>
  </div>
</div>

<div id="pup-row">
  <div class="pup-chip" id="chip-shield" style="color:#7df3ff">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.6-3 7.6-7 9.2C8 18.6 5 15.6 5 11V6l7-3z"/></svg>
  </div>
  <div class="pup-chip" id="chip-slow" style="color:#9fd0ff">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v20M4 6.5l16 11M20 6.5l-16 11"/></svg>
    <span class="chip-bar"><i id="bar-slow"></i></span>
  </div>
  <div class="pup-chip" id="chip-magnet" style="color:#ff9fd0">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 3v7a5 5 0 0 0 10 0V3M7 3h4M13 3h4"/></svg>
    <span class="chip-bar"><i id="bar-magnet"></i></span>
  </div>
  <div class="pup-chip" id="chip-dash" style="color:#ffe066">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L5 13h5l-2 9 9-12h-5l1-8z"/></svg>
    <span class="chip-bar"><i id="bar-dash"></i></span>
  </div>
</div>

<div id="banner"><div id="banner-lv"></div><div id="banner-name"></div></div>

<!-- HOME -->
<div id="screen-home" class="screen on">
  <div class="home-wrap">
    <div class="logo">
      <div class="logo-top">DODGE</div>
      <div class="logo-bot"><span>THE</span> CHAOS</div>
    </div>
    <div class="tagline">HOW LONG CAN YOU SURVIVE?</div>
    <div class="home-stats">
      <div class="hs"><span class="hs-l">BEST RUN</span><span class="hs-v" id="home-best">0</span></div>
      <div class="hs-div"></div>
      <div class="hs"><span class="hs-l">STARS</span><span class="hs-v" id="home-stars">0/60</span></div>
      <div class="hs-div"></div>
      <div class="hs"><span class="hs-l">COINS</span><span class="hs-v gold" id="home-coins">0</span></div>
    </div>
    <div class="home-col">
      <button class="btn primary big" id="btn-campaign">CAMPAIGN · 20 LEVELS</button>
      <button class="btn big" id="btn-endless">ENDLESS MODE</button>
      <div class="home-row">
        <button class="btn" id="btn-shop">SHOP</button>
        <button class="btn" id="btn-sound">SOUND: ON</button>
      </div>
    </div>
    <div class="home-hint">MOVE — <b>WASD</b> / <b>ARROWS</b> / <b>DRAG</b><br>PAUSE — <b>P</b> · MUTE — <b>M</b></div>
  </div>
</div>

<!-- LEVEL SELECT -->
<div id="screen-select" class="screen">
  <div class="panel wide">
    <span class="cnr tl"></span><span class="cnr tr"></span><span class="cnr bl"></span><span class="cnr br"></span>
    <div class="shop-head">
      <button class="icon-btn" id="sel-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5l-7 7 7 7"/></svg>
      </button>
      <div class="shop-title">SELECT LEVEL</div>
      <div class="shop-balance">
        <svg viewBox="0 0 24 24"><path d="M12 2.2l2.8 6 6.6.6-5 4.3 1.5 6.4L12 16.6 6.1 19.5l1.5-6.4-5-4.3 6.6-.6z" fill="currentColor"/></svg>
        <span id="sel-stars">0/60</span>
      </div>
    </div>
    <div id="level-grid"></div>
  </div>
</div>

<!-- SHOP -->
<div id="screen-shop" class="screen">
  <div class="panel">
    <span class="cnr tl"></span><span class="cnr tr"></span><span class="cnr bl"></span><span class="cnr br"></span>
    <div class="shop-head">
      <button class="icon-btn" id="shop-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5l-7 7 7 7"/></svg>
      </button>
      <div class="shop-title">SHOP</div>
      <div class="shop-balance">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="2.6"/><circle cx="12" cy="12" r="3.4" fill="currentColor"/></svg>
        <span id="shop-coins">0</span>
      </div>
    </div>
    <div id="char-list"></div>
    <div class="shop-hint">EARN COINS BY DODGING CHAOS</div>
  </div>
</div>

<!-- LEVEL CLEAR -->
<div id="screen-clear" class="screen">
  <div class="panel">
    <span class="cnr tl"></span><span class="cnr tr"></span><span class="cnr bl"></span><span class="cnr br"></span>
    <div id="clear-title">LEVEL CLEAR</div>
    <div id="clear-sub"></div>
    <div id="clear-stars">
      <svg class="st" viewBox="0 0 24 24"><path d="M12 2.2l2.8 6 6.6.6-5 4.3 1.5 6.4L12 16.6 6.1 19.5l1.5-6.4-5-4.3 6.6-.6z"/></svg>
      <svg class="st" viewBox="0 0 24 24"><path d="M12 2.2l2.8 6 6.6.6-5 4.3 1.5 6.4L12 16.6 6.1 19.5l1.5-6.4-5-4.3 6.6-.6z"/></svg>
      <svg class="st" viewBox="0 0 24 24"><path d="M12 2.2l2.8 6 6.6.6-5 4.3 1.5 6.4L12 16.6 6.1 19.5l1.5-6.4-5-4.3 6.6-.6z"/></svg>
    </div>
    <div class="stats">
      <div class="strow"><span class="lbl">TIME</span><span class="dots"></span><span class="val" id="cl-time">00:00</span></div>
      <div class="strow"><span class="lbl">DODGED</span><span class="dots"></span><span class="val" id="cl-dodge">0</span></div>
      <div class="strow"><span class="lbl">COINS</span><span class="dots"></span><span class="val gold" id="cl-coins">+0</span></div>
    </div>
    <button class="btn primary big" id="btn-next" style="margin-bottom:12px">NEXT LEVEL</button>
    <div class="home-row">
      <button class="btn" id="btn-replay">REPLAY</button>
      <button class="btn ghost" id="cl-menu">MENU</button>
    </div>
  </div>
</div>

<!-- GAME OVER -->
<div id="screen-over" class="screen">
  <div class="panel">

<script>
'use strict';
/* ============================================================
   DODGE THE CHAOS — 20 unique levels, 4 bosses, physics-driven

const TAU=Math.PI*2;
const $=s=>document.getElementById(s);
const rand=(a,b)=>a+Math.random()*(b-a);
const irand=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
const dist2=(x1,y1,x2,y2)=>{const dx=x2-x1,dy=y2-y1;return dx*dx+dy*dy;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmtTime=s=>{const m=Math.floor(s/60),ss=Math.floor(s%60);return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');};
const roman=n=>['','I','II','III','IV','V'][n]||n;
function circleRect(cx,cy,cr,rx,ry,rw,rh){
  const nx=clamp(cx,rx,rx+rw),ny=clamp(cy,ry,ry+rh);
  return dist2(cx,cy,nx,ny)<cr*cr;
}
function circ(g,x,y,r){g.beginPath();g.arc(x,y,r,0,TAU);g.fill();}
function segDist(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
  let t=l2?((px-x1)*dx+(py-y1)*dy)/l2:0;t=clamp(t,0,1);
  return Math.hypot(px-(x1+dx*t),py-(y1+dy*t));
}

/* ================= Storage ================= */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};

/* ================= Audio — كله مولّد بالكود ================= */
let actx=null,master=null,sfxGain=null,musicGain=null,windGain=null,rumbleGain=null;
let muted=store.get('dtc_muted',false);
let musicOn=false;
const music={step:0,next:0,bpm:96};
const BASSLINE=[55,0,0,55,0,0,55,0, 65.41,0,0,65.41,0,0,58.27,0, 73.42,0,0,73.42,0,0,73.42,0, 87.31,0,0,82.41,0,0,98,0];
const LEADSEQ=[440,0,523.25,0,0,659.25,0,0, 523.25,0,440,0,0,392,0,0, 440,0,587.33,0,0,659.25,0,0, 523.25,0,493.88,0,440,0,0,0];
function toneAt(freq,dur,type,vol,t,slide,dest){
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(dest||sfxGain);o.start(t);o.stop(t+dur+0.03);
}
function tone(freq,dur,type,vol,delay,slide){
  if(!actx||muted)return;
  toneAt(freq,dur,type||'sine',vol||0.2,actx.currentTime+(delay||0),slide||0,sfxGain);
}
function noiseBurst(dur,vol,delay,freq,type){
  if(!actx||muted)return;
  const t=actx.currentTime+(delay||0);
  const len=Math.max(1,(actx.sampleRate*dur)|0);
  const b=actx.createBuffer(1,len,actx.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
  const s=actx.createBufferSource();s.buffer=b;
  const f=actx.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq||800;
  const g=actx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(g);g.connect(sfxGain);s.start(t);
}
const sfx={
  click(){tone(660,0.05,'square',0.1);},
  coin(f){tone(f||1318,0.08,'sine',0.2);tone((f||1318)*1.335,0.13,'sine',0.17,0.06);},
  hit(){noiseBurst(0.3,0.55,0,900);tone(180,0.32,'sawtooth',0.38,0,55);},
  power(){tone(300,0.26,'sawtooth',0.15,0,900);tone(1200,0.18,'sine',0.13,0.08);},
  beep(){tone(1150,0.06,'square',0.13);},
  laser(){tone(150,0.45,'sawtooth',0.26,0,95);noiseBurst(0.2,0.13,0,2500,'highpass');},
  close(){tone(880,0.09,'sine',0.17);tone(1318,0.15,'sine',0.17,0.08);},
  levelup(){[523,659,784,1046].forEach((f,i)=>tone(f,0.14,'triangle',0.2,i*0.09));},
  gameover(){[330,262,196].forEach((f,i)=>tone(f,0.4,'sawtooth',0.2,i*0.28));},
  shieldbrk(){noiseBurst(0.28,0.4,0,1600,'highpass');tone(900,0.3,'square',0.18,0,200);},
  heart(){tone(660,0.1,'sine',0.2);tone(990,0.15,'sine',0.2,0.09);},
  err(){tone(190,0.16,'square',0.18);},
  tick(){tone(1500,0.05,'square',0.12);},
  exitOpen(){tone(440,0.3,'sine',0.2,0,880);tone(1320,0.25,'sine',0.16,0.2);},
  coreOpen(){tone(220,0.3,'square',0.14,0,880);},
  bossHit(){noiseBurst(0.32,0.5,0,700);tone(320,0.35,'sawtooth',0.3,0,80);},
  bossDie(){noiseBurst(0.8,0.55,0,500);tone(400,0.9,'sawtooth',0.3,0,50);tone(200,1.1,'sawtooth',0.25,0.2,40);},
  fanfare(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,0.18,'triangle',0.2,i*0.1));},
  heartbeep(){tone(75,0.1,'sine',0.4);tone(58,0.13,'sine',0.35,0.15);},
  alarm(){tone(520,0.28,'square',0.16);tone(392,0.34,'square',0.16,0.34);tone(520,0.28,'square',0.16,0.72);},
  tlock(){tone(1250,0.05,'square',0.14);tone(1250,0.05,'square',0.14,0.09);},
  quakeWarn(){tone(70,0.55,'sawtooth',0.3,0,45);}
};
function kick(t){
  const o=actx.createOscillator(),g=actx.createGain();
  o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+0.12);
  g.gain.setValueAtTime(0.55,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.13);
  o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+0.15);
}
function hat(t){
  const d=0.04,len=Math.max(1,(actx.sampleRate*d)|0);
  const b=actx.createBuffer(1,len,actx.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
  const s=actx.createBufferSource();s.buffer=b;
  const f=actx.createBiquadFilter();f.type='highpass';f.frequency.value=7000;
  const g=actx.createGain();g.gain.setValueAtTime(0.11,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
  s.connect(f);f.connect(g);g.connect(musicGain);s.start(t);
}
function schedStep(s,t,spb){
  if(s%8===0)kick(t);
  if(s%4===2)hat(t);
  const b=BASSLINE[s];if(b)toneAt(b,spb*2,'sawtooth',0.28,t,0,musicGain);
  if(state==='playing'&&level>=3){const n=LEADSEQ[s];if(n)toneAt(n,spb*0.9,'square',0.085,t,0,musicGain);}
}
setInterval(()=>{
  if(!actx||!musicOn||muted)return;
  const spb=60/music.bpm/4;
  while(music.next<actx.currentTime+0.16){
    schedStep(music.step,music.next,spb);
    music.step=(music.step+1)%32;music.next+=spb;
  }
},40);
function setMusic(on){musicOn=on;if(on&&actx)music.next=actx.currentTime+0.1;}
function initAudio(){
  if(actx)return;
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain();master.gain.value=muted?0:0.5;master.connect(actx.destination);
    sfxGain=actx.createGain();sfxGain.gain.value=0.5;sfxGain.connect(master);
    musicGain=actx.createGain();musicGain.gain.value=0.3;musicGain.connect(master);
    // حلقات ضوضاء محيطة: رياح + دوِيّ زلزال
    const mkLoop=(ft,fq)=>{
      const len=(actx.sampleRate*1.5)|0;
      const b=actx.createBuffer(1,len,actx.sampleRate),ch=b.getChannelData(0);
      for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
      const s=actx.createBufferSource();s.buffer=b;s.loop=true;
      const f=actx.createBiquadFilter();f.type=ft;f.frequency.value=fq;
      const g=actx.createGain();g.gain.value=0;
      s.connect(f);f.connect(g);g.connect(master);s.start();
      return g;
    };
    windGain=mkLoop('bandpass',600);
    rumbleGain=mkLoop('lowpass',90);
    setMusic(true);
  }catch(e){}
}
function unlockAudio(){if(!actx)initAudio();if(actx&&actx.state==='suspended')actx.resume();}
window.addEventListener('pointerdown',unlockAudio);
window.addEventListener('keydown',unlockAudio);
function applyMute(){
  if(master)master.gain.value=muted?0:0.5;
  $('btn-mute').innerHTML=muted
    ?'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
    :'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.7a4.7 4.7 0 0 1 0 6.6M18.8 6.4a8 8 0 0 1 0 11.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  $('btn-sound').textContent='SOUND: '+(muted?'OFF':'ON');
}
function toggleMute(){muted=!muted;store.set('dtc_muted',muted);applyMute();sfx.click();}

function makeStars(){
  stars.length=0;
  for(let i=0;i<110;i++)stars.push({x:Math.random()*W,y:Math.random()*H,z:Math.pow(Math.random(),1.6),ph:rand(0,TAU)});

    c:cols[i]+(0.045+Math.random()*0.02)+')',sp:rand(0.05,0.12),ph:rand(0,TAU)});
}
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=W*DPR;cv.height=H*DPR;
  cv.style.width=W+'px';cv.style.height=H+'px';
  darkCv.width=W;darkCv.height=H;
  playW=Math.min(W,620);playX=(W-playW)/2;
  spd=clamp(H/800,0.7,1.3);

}

const CHARCOL={runner:'#35e6ff',cat:'#ffb454',robot:'#a8b6ee',alien:'#7dff8e',ninja:'#8fa2d9'};
function drawChar(g,id,r,t,lx,ly){
  lx=lx||0;ly=ly||0;
  switch(id){
    case 'cat':{
      g.fillStyle='#ff9f43';
      g.beginPath();g.moveTo(-r*0.78,-r*0.5);g.lineTo(-r*0.95,-r*1.3);g.lineTo(-r*0.15,-r*0.78);g.closePath();g.fill();
      g.beginPath();g.moveTo(r*0.78,-r*0.5);g.lineTo(r*0.95,-r*1.3);g.lineTo(r*0.15,-r*0.78);g.closePath();g.fill();
      g.fillStyle='#ffd9a0';
      g.beginPath();g.moveTo(-r*0.72,-r*0.6);g.lineTo(-r*0.8,-r*1.08);g.lineTo(-r*0.38,-r*0.76);g.closePath();g.fill();
      g.beginPath();g.moveTo(r*0.72,-r*0.6);g.lineTo(r*0.8,-r*1.08);g.lineTo(r*0.38,-r*0.76);g.closePath();g.fill();
      g.fillStyle='#ffb454';circ(g,0,0,r);
      g.lineWidth=2;g.strokeStyle='rgba(255,235,200,.75)';g.beginPath();g.arc(0,0,r,0,TAU);g.stroke();
      const ex=lx*r*0.14,ey=-r*0.08+ly*r*0.1;
      g.strokeStyle='#2b1a05';g.lineWidth=2.2;g.lineCap='round';
      g.beginPath();g.arc(-r*0.36+ex,ey,r*0.2,Math.PI,TAU);g.stroke();
      g.beginPath();g.arc(r*0.36+ex,ey,r*0.2,Math.PI,TAU);g.stroke();
      g.fillStyle='#2b1a05';circ(g,ex,r*0.26,r*0.1);
      break;
    }
    case 'robot':{
      const w=r*1.7,h=r*1.7,x=-w/2,y=-h/2,rr=r*0.32;
      g.fillStyle='#a8b6ee';
      g.beginPath();
      g.moveTo(x+rr,y);g.lineTo(x+w-rr,y);g.quadraticCurveTo(x+w,y,x+w,y+rr);
      g.lineTo(x+w,y+h-rr);g.quadraticCurveTo(x+w,y+h,x+w-rr,y+h);
      g.lineTo(x+rr,y+h);g.quadraticCurveTo(x,y+h,x,y+h-rr);
      g.lineTo(x,y+rr);g.quadraticCurveTo(x,y,x+rr,y);g.closePath();g.fill();
      g.lineWidth=2;g.strokeStyle='#dfe9ff';g.stroke();
      g.fillStyle='#0c1830';circ(g,0,-r*0.12,r*0.44);
      g.fillStyle='#6ef0ff';circ(g,lx*r*0.16,-r*0.12+ly*r*0.12,r*0.17);
      g.strokeStyle='#0c1830';g.lineWidth=r*0.12;g.lineCap='round';
      g.beginPath();g.moveTo(-r*0.42,r*0.48);g.lineTo(r*0.42,r*0.48);g.stroke();
      g.strokeStyle='#dfe9ff';g.lineWidth=2;
      g.beginPath();g.moveTo(0,-r*0.85);g.lineTo(0,-r*1.25);g.stroke();
      g.fillStyle='#ff5a7a';circ(g,0,-r*1.3,r*0.15);
      break;
    }
    case 'alien':{
      g.fillStyle='#7dff8e';
      g.beginPath();g.ellipse(0,0,r*0.98,r*1.08,0,0,TAU);g.fill();
      g.lineWidth=2;g.strokeStyle='rgba(220,255,225,.75)';g.stroke();
      g.fillStyle='#071a10';
      g.beginPath();g.ellipse(-r*0.34+lx*r*0.1,-r*0.12+ly*r*0.08,r*0.24,r*0.36,-0.35,0,TAU);g.fill();
      g.beginPath();g.ellipse(r*0.34+lx*r*0.1,-r*0.12+ly*r*0.08,r*0.24,r*0.36,0.35,0,TAU);g.fill();
      g.fillStyle='rgba(255,255,255,.85)';
      circ(g,-r*0.28+lx*r*0.1,-r*0.24+ly*r*0.08,r*0.07);
      circ(g,r*0.4+lx*r*0.1,-r*0.24+ly*r*0.08,r*0.07);
      g.strokeStyle='#071a10';g.lineWidth=1.8;g.lineCap='round';
      g.beginPath();g.arc(0,r*0.42,r*0.18,0.15*Math.PI,0.85*Math.PI);g.stroke();
      break;
    }
    case 'ninja':{
      const fl=Math.sin(t*6)*3;
      g.fillStyle='#e0405f';
      g.beginPath();
      g.moveTo(r*0.5,-r*0.5);
      g.quadraticCurveTo(r*1.5,-r*0.9+fl,r*1.8,-r*0.2+fl);
      g.quadraticCurveTo(r*1.3,-r*0.1+fl*0.5,r*0.6,0);
      g.closePath();g.fill();
      g.fillStyle='#2b3350';circ(g,0,0,r);
      g.lineWidth=2;g.strokeStyle='rgba(150,170,220,.7)';
      g.beginPath();g.arc(0,0,r,0,TAU);g.stroke();
      g.fillStyle='#e0405f';
      g.fillRect(-r,-r*0.42,r*2,r*0.34);
      const ey=-r*0.1+ly*r*0.12;
      g.fillStyle='#e8f0ff';
      g.save();g.translate(-r*0.3+lx*r*0.1,ey);g.rotate(-0.25);g.fillRect(-r*0.16,-r*0.07,r*0.32,r*0.14);g.restore();
      g.save();g.translate(r*0.3+lx*r*0.1,ey);g.rotate(0.25);g.fillRect(-r*0.16,-r*0.07,r*0.32,r*0.14);g.restore();
      break;
    }
    default:{
      g.fillStyle='#35e6ff';circ(g,0,0,r);
      g.lineWidth=2;g.strokeStyle='rgba(220,255,255,.85)';
      g.beginPath();g.arc(0,0,r,0,TAU);g.stroke();
      const vw=r*1.24,vh=r*0.52,vx=-vw/2,vy=-r*0.42,vr=r*0.2;
      g.fillStyle='#04222c';
      g.beginPath();
      g.moveTo(vx+vr,vy);
      g.lineTo(vx+vw-vr,vy);
      g.quadraticCurveTo(vx+vw,vy,vx+vw,vy+vr);
      g.lineTo(vx+vw,vy+vh-vr);
      g.quadraticCurveTo(vx+vw,vy+vh,vx+vw-vr,vy+vh);
      g.lineTo(vx+vr,vy+vh);
      g.quadraticCurveTo(vx,vy+vh,vx,vy+vh-vr);
      g.lineTo(vx,vy+vr);
      g.quadraticCurveTo(vx,vy,vx+vr,vy);
      g.closePath();g.fill();
      g.fillStyle='rgba(160,246,255,.9)';
      circ(g,-r*0.26+lx*r*0.16,-r*0.22+ly*r*0.1,r*0.1);
      break;
    }
  }
}

function envForce(){ // رياح + تيار — قوة أفقية على كل الأجسام
  let f=0;
  if(diff&&diff.wind&&state!=='menu')f+=Math.sin(elapsed*TAU/diff.wind.period)*diff.wind.amp;
  if(diff&&diff.conveyor&&state!=='menu'){
    f+=conv.warn>0?conv.dir*diff.conveyor.str*(conv.warn/1.3):conv.dir*diff.conveyor.str;
  }
  return f;
}
class Meteor{
  constructor(x,r,vy,vx){
    this.x=x;this.y=-60;this.vx=vx;this.vy=vy;this.r=r;
    this.warn=0.42+r*0.01;this.active=false;this.home=false;this.gone=false;
    this.rot=rand(0,TAU);this.vr=rand(-2,2);
    this.verts=[];for(let i=0;i<9;i++)this.verts.push(rand(0.74,1.14));
    this.cr=[];for(let i=0;i<3;i++)this.cr.push({a:rand(0,TAU),d:rand(0.15,0.5),s:rand(0.12,0.22)});
    this.hitDone=false;this.closeDone=false;
  }
  update(dt){
    if(!this.active){this.warn-=dt;if(this.warn<=0)this.active=true;return;}
    if(this.home&&state==='playing'){
      const want=Math.atan2(player.y-this.y,player.x-this.x);
      const cur=Math.atan2(this.vy,this.vx);
      const dd=Math.atan2(Math.sin(want-cur),Math.cos(want-cur));
      const turn=1.0*dt,na=cur+clamp(dd,-turn,turn);
      const sp=Math.hypot(this.vx,this.vy);
      this.vx=Math.cos(na)*sp;this.vy=Math.sin(na)*sp;
    }else this.vy+=26*dt; // جاذبية خفيفة واقعية
    const fx=envForce();if(fx)this.vx+=fx*0.35*dt;
    this.x+=this.vx*dt;this.y+=this.vy*dt;this.rot+=this.vr*dt;
  }
}
class Wall{
  constructor(vy,gapW){
    this.y=-46;this.h=26;this.vy=vy;this.gapW=gapW;
    this.minX=playX+gapW/2+26;this.maxX=playX+playW-gapW/2-26;
    if(this.minX>this.maxX)this.minX=this.maxX=(playX+playW)/2;
    this.phase=rand(0,TAU);
    this.gsp=Math.min(1.5,rand(0.55,0.95)+level*0.045);
    this.gapX=rand(this.minX,this.maxX);
    this.hitDone=false;
  }
  get rects(){
    const gl=this.gapX-this.gapW/2,gr=this.gapX+this.gapW/2;
    return [[playX,this.y,Math.max(0,gl-playX),this.h],[gr,this.y,Math.max(0,playX+playW-gr),this.h]];
  }
  update(dt){
    this.y+=this.vy*dt;this.phase+=this.gsp*dt;
    const tt=0.5+0.5*Math.sin(this.phase);
    this.gapX=this.minX+tt*(this.maxX-this.minX);
  }
}
class Laser{
  constructor(type,pos){
    this.type=type;this.pos=pos;this.t=0;this.state='warn';
    this.warn=level>=6?1.0:1.35;this.fire=0.62;
    this.hitDone=false;this.beepT=0;
  }
  update(dt){
    this.t+=dt;
    if(this.state==='warn'){
      this.beepT-=dt;
      if(this.beepT<=0){if(state==='playing')sfx.beep();this.beepT=0.34;}
      if(this.t>=this.warn){this.state='fire';this.t=0;if(state==='playing')sfx.laser();}
    }else if(this.state==='fire'&&this.t>=this.fire)this.state='done';
  }
}
class BH{

class FZ{
  constructor(x,y){
    this.x=x;this.y=y;this.r=52;this.t=0;this.state='lure';
    this.wasIn=false;this.hitDone=false;
    this.lure=2.1;this.arm=0.7;this.boom=0.55;
  }
  update(dt){
    this.t+=dt;
    if(this.state==='lure'){
      if(state==='playing'&&dist(player.x,player.y,this.x,this.y)<this.r)this.wasIn=true;
      if(this.t>=this.lure){this.state='arm';this.t=0;}
    }else if(this.state==='arm'){
      if(this.t>=this.arm){
        this.state='boom';this.t=0;
        burst(this.x,this.y,'#ff3860',30,420,0.6,3);
        shake=Math.max(shake,6);
        if(state==='playing')blast(this.x,this.y,170,260);
      }
    }else if(this.state==='boom'&&this.t>=this.boom)this.state='done';
  }
  get waveR(){return this.r*(0.35+(this.t/this.boom)*2.1);}
}
class Coin{
  constructor(x,y,vy){this.x=x;this.y=y;this.vy=vy;this.ph=rand(0,TAU);}
  update(dt){
    this.ph+=dt*6;
    if(state==='playing'&&player.magnetT>0&&dist(this.x,this.y,player.x,player.y)<260){
      const d=dist(this.x,this.y,player.x,player.y)||1;
      this.x+=(player.x-this.x)/d*480*dt;
      this.y+=(player.y-this.y)/d*480*dt;
    }else this.y+=this.vy*dt;
    const fx=envForce();
    if(fx)this.x=clamp(this.x+fx*0.05*dt,playX+10,playX+playW-10);
  }
}
class Pup{
  constructor(x,kind,vy){this.x=x;this.y=-30;this.vy=vy;this.ph=rand(0,TAU);this.kind=kind;}

class Shard{ // شظية: frag = من انفجار شهب (بجاذبية)، ric = بلورة مرتدة من الحوائط
  constructor(x,y,vx,vy,kind){
    this.x=x;this.y=y;this.px=x;this.py=y;this.vx=vx;this.vy=vy;this.kind=kind;
    this.rot=rand(0,TAU);this.vr=rand(-7,7);this.r=kind==='frag'?5.5:7;
    this.t=0;this.b=0;this.dead=false;
  }
  update(dt){
    this.px=this.x;this.py=this.y;
    if(this.kind==='frag')this.vy+=640*dt;
    this.x+=this.vx*dt;this.y+=this.vy*dt;this.rot+=this.vr*dt;this.t+=dt;
    if(this.kind==='ric'){
      if(this.y<76&&this.vy<0)this.vy*=-1;
      if((this.x<playX+10&&this.vx<0)||(this.x>playX+playW-10&&this.vx>0)){
        if(this.b<3){this.vx*=-0.96;this.b++;tone(1400,0.04,'square',0.06);}
        else this.dead=true;
      }
    }
    if(this.y>H+50||this.t>14)this.dead=true;
  }
}
class Turret{ // مدفع يترصدك: يصوّب بسطر رصد، يقفل، ويطلق دفعة نحو موقعك المتوقع
  constructor(side){
    this.side=side;
    this.x=side?playX+playW-15:playX+15;
    this.y=rand(130,Math.max(160,H-230));
    this.t=0;this.state='in';this.a=side?Math.PI:0;this.alpha=0;this.cycles=0;
    this.fireT=0;this.shots=0;this.dead=false;
  }
  update(dt){
    this.t+=dt;
    if(this.state==='in'){this.alpha=Math.min(1,this.t/0.5);if(this.t>=0.5){this.state='aim';this.t=0;}}
    else if(this.state==='aim'){
      const px=player.x+player.vx*0.28,py=player.y+player.vy*0.28;
      this.a=Math.atan2(py-this.y,px-this.x);
      if(this.t>=0.95){this.state='lock';this.t=0;if(state==='playing')sfx.tlock();}
    }
    else if(this.state==='lock'){if(this.t>=0.35){this.state='fire';this.t=0;this.shots=0;this.fireT=0;}}
    else if(this.state==='fire'){
      this.fireT-=dt;
      if(this.fireT<=0&&this.shots<3){
        const sp=265;
        bullets.push(mkBullet(this.x+Math.cos(this.a)*16,this.y+Math.sin(this.a)*16,Math.cos(this.a)*sp,Math.sin(this.a)*sp,6));
        noiseBurst(0.06,0.14,0,2000,'highpass');
        this.shots++;this.fireT=0.12;
      }
      if(this.shots>=3&&this.fireT<=0){
        this.cycles++;
        if(this.cycles>=2){this.state='out';this.t=0;}
        else{this.state='aim';this.t=0;}
      }
    }
    else if(this.state==='out'){this.alpha=Math.max(0,1-this.t/0.5);if(this.t>=0.5)this.dead=true;}
  }
}
class OrbitGroup{ // حلقة حطام بتلف حول نقطة وتنزل ببطء
  constructor(scatter){
    this.cx=rand(playX+95,playX+playW-95);
    this.cy=scatter?rand(140,H*0.55):-90;
    this.vy=rand(30,46)+level*0.6;
    this.r=rand(62,95);this.n=irand(3,5);
    this.ang=rand(0,TAU);this.av=rand(0.6,1.15)*(Math.random()<0.5?-1:1);
    this.chunks=[];
    for(let i=0;i<this.n;i++)this.chunks.push({o:rand(-0.2,0.2),r:rand(7,10),rot:rand(0,TAU),vr:rand(-3,3)});
    this.dead=false;
  }
  pos(i){const a=this.ang+i*TAU/this.n+this.chunks[i].o;return [this.cx+Math.cos(a)*this.r,this.cy+Math.sin(a)*this.r];}
  update(dt){
    this.cy+=this.vy*dt;this.ang+=this.av*dt;
    for(const c of this.chunks)c.rot+=c.vr*dt;
    if(this.cy-this.r>H+60)this.dead=true;
  }
}
class FogBlob{ // سديم معتم يخفي العوائق تحته
  constructor(scatter){
    this.r=rand(85,150);
    this.x=rand(playX+this.r*0.4,playX+playW-this.r*0.4);
    this.y=scatter?rand(60,H-80):-this.r;

  }
  update(dt,t){
    this.y+=this.vy*dt;
    this.x+=Math.sin(t*this.sw+this.ph)*10*dt;
    if(this.y-this.r>H+30){this.y=-this.r;this.x=rand(playX+this.r*0.4,playX+playW-this.r*0.4);}
  }
}
function mkBullet(x,y,vx,vy,r){return {x:x,y:y,vx:vx,vy:vy,r:r||7,t:0,life:9};}

class Boss{
  constructor(type){
    this.type=type;
    this.maxHp={warden:4,sentinel:5,hive:5,core:6}[type];
    this.hp=this.maxHp;this.phase=1;
    this.coreR={warden:33,sentinel:30,hive:33,core:38}[type];
    this.x=playX+playW/2;this.y=170;this.t=0;
    this.range=Math.max(60,playW/2-120);
    this.state='closed';this.stateT=0;
    this.atkT=2;this.pat=0;
    this.sweep=null;this.beamA=0;this.beamOn=false;
    this.orbT=4;this.wallT=5;
    this.dead=false;this.deathT=0;this.bxT=0;this.flash=0;
  }
  update(dt){
    this.t+=dt;this.stateT+=dt;this.flash=Math.max(0,this.flash-dt*3);
    if(this.dead){
      this.deathT+=dt;this.bxT-=dt;
      if(this.bxT<=0){
        this.bxT=0.11;
        burst(this.x+rand(-44,44),this.y+rand(-30,30),pick(['#ff3860','#ffc857','#ffffff']),12,320,0.6,3);
        shake=Math.max(shake,7);noiseBurst(0.1,0.12,0,1500);
      }
      if(this.deathT>1.7)levelClear();
      return;
    }
    const cx=playX+playW/2;
    if(this.type==='sentinel'){this.x=cx+Math.sin(this.t*0.85)*this.range;this.y=150+Math.sin(this.t*2.2)*8;}
    else if(this.type==='core'){this.x=cx+Math.sin(this.t*0.35)*this.range*0.7;this.y=168+Math.sin(this.t*1.3)*10;}
    else{this.x=cx+Math.sin(this.t*(this.type==='hive'?0.65:0.5))*this.range;this.y=(this.type==='hive'?165:170)+Math.sin(this.t*1.6)*10;}
    const phase=this.type==='core'?(this.hp>4?1:this.hp>2?2:3):1;
    if(this.type==='core')this.phase=phase;
    // دورات فتح/قفل اللب — وقت الضرب
    if(this.type==='sentinel'){
      if(this.state==='closed'&&this.stateT>1.1&&!this.sweep){
        const a0=Math.random()<0.5?0.15*Math.PI:0.85*Math.PI;
        this.sweep={phase:'tel',t:0,a:a0,dir:a0<Math.PI/2?1:-1};
        sfx.beep();
      }
    }else{
      const closed=this.type==='hive'?2.6:this.type==='core'?(phase===3?3.4:3.0):3.2;
      const open=this.type==='core'?(phase===3?1.6:2.2):this.type==='hive'?1.8:2.2;
      if(this.state==='closed'&&this.stateT>=closed){this.state='open';this.stateT=0;sfx.coreOpen();}
      else if(this.state==='open'&&this.stateT>=open){this.state='closed';this.stateT=0;}
    }
    // مسح الليزر الدوّار
    if(this.sweep){
      const s=this.sweep;s.t+=dt;
      if(s.phase==='tel'){if(s.t>=0.9){s.phase='run';s.t=0;sfx.laser();}}
      else{
        s.a+=s.dir*dt*(0.7*Math.PI/2.1);
        if(s.t>=2.1){this.sweep=null;this.state='open';this.stateT=0;}
      }
    }
    // أشعة الزعيم الأخير الدوارة
    if(this.type==='core'&&this.state==='closed'){
      this.beamOn=true;
      this.beamA+=dt*(phase===3?0.85:0.55);
    }else this.beamOn=false;
    // هجمات
    this.atkT-=dt;
    if(this.atkT<=0&&this.state!=='open'&&!this.sweep){
      this.attack(phase);
      this.atkT=rand(1.4,2.0)*(this.type==='core'&&phase===3?0.72:1);
    }
    if(this.type==='hive'){
      this.orbT-=dt;
      if(this.orbT<=0&&orbits.length<2){orbits.push(new OrbitGroup(true));this.orbT=5;sfx.beep();}
    }
    if(this.type==='core'&&phase===3){
      this.wallT-=dt;
      if(this.wallT<=0&&walls.length<1){walls.push(new Wall(115*spd,Math.max(110,150)));this.wallT=5.5;}
    }
  }
  attack(phase){
    if(this.type==='warden'||(this.type==='core'&&phase===1)){
      this.pat^=1;
      this.pat?this.fan(irand(3,4),0.24,215):this.ring(irand(12,14),150);
    }else if(this.type==='sentinel')this.fan(3,0.3,235);
    else if(this.type==='hive')this.fan(irand(3,4),0.26,205);
    else{
      this.pat^=1;
      this.pat?this.fan(5,0.22,230):this.ring(16,165);
    }
  }
  fan(n,spread,sp){
    const a=Math.atan2(player.y-this.y,player.x-this.x);
    for(let i=0;i<n;i++){
      const aa=a+(i-(n-1)/2)*spread;
      bullets.push(mkBullet(this.x,this.y+16,Math.cos(aa)*sp,Math.sin(aa)*sp));
    }
    sfx.beep();
  }
  ring(n,sp){
    const off=rand(0,TAU);
    for(let i=0;i<n;i++){
      const aa=off+i/n*TAU;
      bullets.push(mkBullet(this.x,this.y+16,Math.cos(aa)*sp,Math.sin(aa)*sp));
    }
    sfx.laser();
  }
}

function burst(x,y,color,n,speed,life,size){
  if(parts.length>420)return;

    const a=rand(0,TAU),s=rand(speed*0.25,speed);
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:rand(life*0.5,life),color:color,size:rand(size*0.5,size)});
  }
}
function addText(txt,color,x,y,life,size){
  if(texts.length>24)return;
  texts.push({txt:txt,color:color,x:x,y:y,t:0,life:life||1,size:size||15});
}
function flash(a,c){flashA=Math.max(flashA,a);flashC=c||'#ffffff';}
function blast(x,y,R,power){ // موجة صدم حقيقية تدفع اللاعب
  if(state!=='playing')return;
  const d=dist(player.x,player.y,x,y);
  if(d<R&&d>1){
    const k=1-d/R;
    player.vx+=(player.x-x)/d*power*k;
    player.vy+=(player.y-y)/d*power*k*0.7;
  }
}
function meteorImpact(m){ // ارتطام واقعي: غبار + حرق + موجة دفع + شظايا
  decals.push({x:m.x,r:m.r*1.5,a:1,heat:1});

  rings.push({x:m.x,y:groundY,r:m.r*0.5,max:m.r*6+30,t:0,life:0.5});
  burst(m.x,groundY-4,'#8b7355',irand(8,14),130,0.5,2.5);
  burst(m.x,groundY-4,'#ff8a3c',6,210,0.3,2);
  blast(m.x,groundY,m.r*7+40,170+m.r*3);
  noiseBurst(0.16,0.2,0,320);
  if(diff&&diff.frag){
    const n=irand(2,4);
    for(let i=0;i<n;i++)shards.push(new Shard(m.x,groundY-6,rand(-170,170),rand(-300,-160),'frag'));
  }
}

const keys={};
const joy={active:false,id:null,bx:0,by:0,dx:0,dy:0,r:56};
window.addEventListener('keydown',e=>{

cv.addEventListener('pointerdown',e=>{
  if(state!=='playing')return;
  joy.active=true;joy.id=e.pointerId;
  joy.bx=e.clientX;joy.by=e.clientY;joy.dx=0;joy.dy=0;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(!joy.active||e.pointerId!==joy.id)return;
  let dx=e.clientX-joy.bx,dy=e.clientY-joy.by;
  const l=Math.hypot(dx,dy);
  if(l>joy.r){dx=dx/l*joy.r;dy=dy/l*joy.r;}
  joy.dx=dx;joy.dy=dy;
});
function releaseJoy(e){if(joy.active&&e.pointerId===joy.id){joy.active=false;joy.dx=0;joy.dy=0;}}
cv.addEventListener('pointerup',releaseJoy);
cv.addEventListener('pointercancel',releaseJoy);
function inputVec(){
  let dx=0,dy=0;
  if(keys.ArrowLeft||keys.KeyA)dx--;
  if(keys.ArrowRight||keys.KeyD)dx++;
  if(keys.ArrowUp||keys.KeyW)dy--;
  if(keys.ArrowDown||keys.KeyS)dy++;
  if(joy.active){dx+=joy.dx/joy.r;dy+=joy.dy/joy.r;}
  const l=Math.hypot(dx,dy);
  if(l>1){dx/=l;dy/=l;}
  return [dx,dy];
}

/* ================= Player ================= */
function updatePlayer(dt){
  player.invuln=Math.max(0,player.invuln-dt);
  player.slowT=Math.max(0,player.slowT-dt);
  player.magnetT=Math.max(0,player.magnetT-dt);
  player.dashT=Math.max(0,player.dashT-dt);
  const iv=inputVec();
  const acc=player.dashT>0?5600:2800;
  player.vx+=iv[0]*acc*dt;player.vy+=iv[1]*acc*dt;
  player.vx+=envForce()*dt; // الريح والتيار
  for(const h of holes){
    const dx=h.x-player.x,dy=h.y-player.y,d=Math.hypot(dx,dy);
    if(d<h.r*8&&d>1){const f=Math.min(950,26000/d)/d;player.vx+=dx*f*dt;player.vy+=dy*f*dt;}
  }
  const fr=(diff&&diff.ice)?1.9:7; // الجليد = احتكاك شبه معدوم
  const damp=Math.exp(-fr*dt);
  player.vx*=damp;player.vy*=damp;
  player.x+=player.vx*dt;player.y+=player.vy*dt;
  player.x=clamp(player.x,playX+player.r+2,playX+playW-player.r-2);
  player.y=clamp(player.y,72,H-player.r-4);
  player.trail.unshift({x:player.x,y:player.y});
  if(player.trail.length>14)player.trail.pop();
}
function hitPlayer(){
  if(player.invuln>0||state!=='playing')return;
  if(player.shield){
    player.shield=false;player.invuln=0.9;
    burst(player.x,player.y,'#7df3ff',26,380,0.55,3);
    addText('SHIELD BREAK','#7df3ff',player.x,player.y-34);
    flash(0.14,'#7df3ff');shake=Math.max(shake,9);sfx.shieldbrk();
    return;
  }
  player.hearts--;damageTaken++;player.invuln=1.7;
  shake=15;flash(0.45,'#ff2050');hitstop=0.09;
  burst(player.x,player.y,'#ff3860',26,340,0.7,3.5);
  burst(player.x,player.y,'#ffffff',10,220,0.4,2);
  sfx.hit();
  if(player.hearts<=0)die();
}
function die(){
  state='dying';deathT=1.15;
  burst(player.x,player.y,'#ff3860',46,480,1,4);
  burst(player.x,player.y,'#ffc857',20,360,0.8,3);

}

function damageBoss(){
  boss.hp--;boss.flash=1;

    score+=600;sfx.bossDie();

}

/* ================= Update ================= */
function sweep(arr,fn){
  for(let i=arr.length-1;i>=0;i--){if(fn(arr[i]))arr.splice(i,1);}
}
function updateConv(dt){
  if(!diff||!diff.conveyor)return;
  conv.t+=dt;
  if(conv.warn>0){
    conv.warn-=dt;
    if(conv.warn<=0){conv.dir*=-1;conv.t=0;}
  }else if(conv.t>diff.conveyor.flip){conv.warn=1.3;sfx.quakeWarn();}
}
function playingUpdate(dt){
  elapsed+=dt;
  score+=dt*(mode==='campaign'?10+level*2:12*level);
  coinComboT-=dt;if(coinComboT<=0)coinCombo=0;
  if(mode==='endless'){
    const nw=1+Math.floor(elapsed/30);
    if(nw!==level){
      level=nw;diff=buildDiff();sfx.levelup();
      showBanner('WAVE '+level,waveUnlock(level)||'INTENSIFYING','#40e8ff');
      music.bpm=Math.min(190,96+(level-1)*8);
      burst(player.x,player.y,'#40e8ff',18,280,0.6,2.5);
    }
  }
  if(mode==='campaign'&&!diff.boss&&!exitOpen){
    const rem=Math.ceil(diff.need-elapsed);
    if(rem<=3&&rem>0&&rem!==lastCount)sfx.tick();
    lastCount=rem;
    if(elapsed>=diff.need){
      exitOpen=true;
      showBanner('EXIT OPEN','RUN!','#7df7ff');
      sfx.exitOpen();flash(0.15,'#40e8ff');
    }
  }
  if(!goShown&&elapsed>GRACE){goShown=true;addText('GO!','#7df7ff',player.x,player.y-64,1.2,20);}
  if(player.hearts===1){hbT-=dt;if(hbT<=0){hbT=1;sfx.heartbeep();}}
  updateConv(dt);
  updatePlayer(dt);
  const os=player.slowT>0?0.35:1,dts=dt*os;
  // قائمة انتظار الزلازل
  for(let i=pending.length-1;i>=0;i--){
    pending[i].t-=dt;
    if(pending[i].t<=0){const f=pending[i].fn;pending.splice(i,1);f();}
  }
  // الزلزال: تحذير → موجة صخور
  if(diff.quake){
    if(quakeState==='idle'){
      quakeT-=dt;
      if(quakeT<=0){quakeState='warn';quakeT=1.4;sfx.quakeWarn();
        addText('!! INCOMING !!','#ff5a3c',playX+playW/2,H*0.42,1.3,18);}
    }else{
      quakeT-=dt;shake=Math.max(shake,2.5);
      if(quakeT<=0){quakeState='idle';quakeT=rand(6.5,9.5);spawnQuakePattern();}
    }
  }
  // الـSpawning
  if(elapsed>GRACE){
    tMet-=dts;
    if(tMet<=0&&meteors.length<diff.met.max){spawnMeteor();tMet=diff.met.int*rand(0.75,1.3);}
    if(diff.walls){tWall-=dts;if(tWall<=0&&walls.length<1){walls.push(new Wall(diff.walls.v*spd,diff.walls.gap));tWall=rand(7,11);}}
    if(diff.lasers){tLas-=dts;if(tLas<=0&&lasers.length<diff.lasers.max){spawnLaser();tLas=rand(5,8.5)-Math.min(2.5,level*0.25);}}
    if(diff.holes&&holes.length<diff.holes.max){
      tBH-=dts;
      if(tBH<=0){holes.push(new BH());tBH=diff.holes.persist?rand(0.9,1.4):rand(10,16);}
    }
    if(diff.fakes){tFZ-=dts;if(tFZ<=0&&fakes.length<diff.fakes.max){spawnFZ();tFZ=rand(8,12);}}
    tCoin-=dts;if(tCoin<=0){spawnCoins();tCoin=rand(2.6,4.2);}
    tPup-=dt;if(tPup<=0){spawnPup();tPup=rand(12,18);}
    if(diff.bounce){
      tBnc-=dts;
      if(tBnc<=0){
        const rn=shards.reduce((a,s)=>a+(s.kind==='ric'?1:0),0);
        if(rn<diff.bounce.max){
          const side=Math.random()<0.5?0:1;
          shards.push(new Shard(side?playX+playW-8:playX+8,rand(130,Math.max(160,H-190)),(side?-1:1)*rand(185,265),rand(-80,80),'ric'));
        }
        tBnc=diff.bounce.int*rand(0.75,1.35);
      }
    }
    if(diff.orbit){tOrb-=dts;if(tOrb<=0&&orbits.length<diff.orbit.max){orbits.push(new OrbitGroup(false));tOrb=diff.orbit.int*rand(0.8,1.2);}}
    if(diff.turrets){tTur-=dt;if(tTur<=0&&turrets.length<diff.turrets.max){turrets.push(new Turret(irand(0,1)));tTur=rand(7,10);}}
    if(diff.fog){while(fogs.length<diff.fog.max)fogs.push(new FogBlob(false));}
  }
  // تحديث الكيانات
  for(const m of meteors)m.update(dts);
  for(const w of walls)w.update(dts);
  for(const l of lasers)l.update(dts);
  for(const h of holes)h.update(dts);
  for(const f of fakes)f.update(dts);
  for(const c of coins)c.update(dts);
  for(const p of pups)p.update(dts);
  for(const s of shards)s.update(dts);
  for(const o of orbits)o.update(dts);
  for(const tu of turrets)tu.update(dts);
  for(const f of fogs)f.update(dts,elapsed);
  if(boss)boss.update(dts);
  // الوصول للمخرج (يتفحص أولاً — كرم مع اللاعب)
  if(mode==='campaign'&&!diff.boss&&exitOpen&&dist(player.x,player.y,exitX,150)<52+player.r*0.5){levelClear();return;}
  // التصادمات
  for(const m of meteors){
    if(m.hitDone||!m.active)continue;
    const rs=m.r+player.r*0.85,d2=dist2(player.x,player.y,m.x,m.y);
    if(d2<rs*rs){m.hitDone=true;m.gone=true;burst(m.x,m.y,'#ff5a3c',16,300,0.5,3);hitPlayer();}
    else if(!m.closeDone&&player.invuln<=0&&d2<(rs+26)*(rs+26)){m.closeDone=true;closeCall();}
  }
  for(const w of walls){
    if(w.hitDone)continue;
    for(const r of w.rects){
      if(circleRect(player.x,player.y,player.r*0.85,r[0],r[1],r[2],r[3])){w.hitDone=true;hitPlayer();break;}
    }
  }
  for(const l of lasers){
    if(l.state!=='fire'||l.hitDone)continue;
    const hit=l.type==='h'?Math.abs(player.y-l.pos)<9+player.r*0.8:Math.abs(player.x-l.pos)<9+player.r*0.8;
    if(hit){l.hitDone=true;hitPlayer();}
  }
  for(const h of holes){
    if(!h.hitDone&&dist(player.x,player.y,h.x,h.y)<h.r*0.75+player.r*0.7){h.hitDone=true;hitPlayer();}
  }
  for(const f of fakes){
    if(f.state==='boom'&&!f.hitDone){
      const d=dist(player.x,player.y,f.x,f.y);
      if(Math.abs(d-f.waveR)<16+player.r*0.8){f.hitDone=true;hitPlayer();}
    }
  }
  for(const s of shards){
    if(dist2(player.x,player.y,s.x,s.y)<(s.r+player.r*0.8)*(s.r+player.r*0.8)){s.dead=true;burst(s.x,s.y,s.kind==='frag'?'#ff8a3c':'#bfeaff',8,180,0.4,2);hitPlayer();}
  }
  for(const o of orbits){
    for(let i=0;i<o.n;i++){
      const p=o.pos(i),c=o.chunks[i];
      if(dist2(player.x,player.y,p[0],p[1])<(c.r+player.r*0.8)*(c.r+player.r*0.8)){hitPlayer();break;}
    }
  }
  for(const tu of turrets){
    if(tu.alpha>0.6&&dist2(player.x,player.y,tu.x,tu.y)<(13+player.r*0.8)*(13+player.r*0.8))hitPlayer();
  }
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.t+=dts;b.x+=b.vx*dts;b.y+=b.vy*dts;
    if(b.t>b.life||b.y>H+30||(b.y<20&&b.vy<0)||b.x<-30||b.x>W+30){bullets.splice(i,1);continue;}
    if(dist2(player.x,player.y,b.x,b.y)<(b.r+player.r*0.8)*(b.r+player.r*0.8)){bullets.splice(i,1);hitPlayer();}
  }
  if(boss&&!boss.dead){
    const br=boss.coreR+player.r*0.8;
    if(dist(player.x,player.y,boss.x,boss.y)<br){
      if(boss.state==='open')damageBoss();
      else hitPlayer();
    }else{
      if(boss.type==='core'&&boss.beamOn){
        if(beamHit(boss.x,boss.y,boss.beamA,1400)||beamHit(boss.x,boss.y,boss.beamA+Math.PI,1400))hitPlayer();
      }
      if(boss.sweep&&boss.sweep.phase==='run'&&beamHit(boss.x,boss.y,boss.sweep.a,1400))hitPlayer();
    }
  }
  // التقاط
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];
    if(dist2(player.x,player.y,c.x,c.y)<(12+player.r)*(12+player.r)){
      coinsBank++;runCoins++;score+=5;
      store.set('dtc_coins',coinsBank);
      coinCombo++;coinComboT=1.2;
      sfx.coin(1318*Math.pow(1.059,Math.min(12,coinCombo-1)));
      burst(c.x,c.y,'#ffc857',8,140,0.45,2.2);
      coins.splice(i,1);
    }
  }
  for(let i=pups.length-1;i>=0;i--){
    const p=pups[i];
    if(dist2(player.x,player.y,p.x,p.y)<(15+player.r)*(15+player.r)){collectPup(p.kind);pups.splice(i,1);}
  }
  // تنظيف + عدّ التفادي
  sweep(meteors,m=>{
    if(m.hitDone||m.gone)return true;
    if(m.active&&m.y>=groundY-m.r*0.25&&m.x>playX-10&&m.x<playX+playW+10){
      meteorImpact(m);dodged++;score+=10;return true;
    }
    if(m.y>H+90||m.x<-90||m.x>W+90){if(!m.hitDone){dodged++;score+=10;}return true;}
    return false;
  });
  sweep(walls,w=>{if(w.y>H+60){if(!w.hitDone){dodged++;score+=20;}return true;}return false;});
  sweep(lasers,l=>{if(l.state==='done'){if(!l.hitDone){dodged++;score+=15;}return true;}return false;});
  sweep(holes,h=>{if(h.life<=0){if(!h.hitDone){dodged++;score+=15;}return true;}return false;});
  sweep(fakes,f=>{
    if(f.state==='done'){
      if(!f.hitDone){
        dodged++;score+=10;
        if(f.wasIn){score+=75;addText('TRAP DODGED +75','#3dffa0',f.x,f.y-40,1.2,15);}
      }
      return true;
    }
    return false;
  });
  sweep(shards,s=>{
    if(s.dead||s.y>H+50){
      if(s.kind==='ric'&&!s._c){s._c=1;dodged++;score+=6;}
      return true;
    }
    return false;
  });
  sweep(orbits,o=>{if(o.dead){dodged+=o.n;score+=8*o.n;return true;}return false;});
  sweep(turrets,t=>t.dead);
  sweep(coins,c=>c.y>H+40);
  sweep(pups,p=>p.y>H+40);
}
function updateStars(dt){
  const base=state==='playing'?26+level*8:14;
  const sl=player.slowT>0?0.4:1;
  for(const s of stars){
    s.y+=base*(0.35+s.z*1.3)*sl*dt;
    if(s.y>H+2){s.y=-2;s.x=Math.random()*W;}
  }
}
function updateFX(dt){
  shake=Math.max(0,shake-42*dt);
  flashA=Math.max(0,flashA-2.6*dt);
  fxFlash.style.background=flashC;
  fxFlash.style.opacity=flashA.toFixed(3);
  fxSlow.classList.toggle('on',player.slowT>0&&state==='playing');
  fxLow.classList.toggle('on',player.hearts===1&&state==='playing');
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.t+=dt;
    if(p.t>=p.life){parts.splice(i,1);continue;}
    const k=Math.exp(-2.2*dt);p.vx*=k;p.vy*=k;
    p.x+=p.vx*dt;p.y+=p.vy*dt;
  }
  for(let i=texts.length-1;i>=0;i--){
    const t=texts[i];t.t+=dt;t.y-=46*dt;
    if(t.t>=t.life)texts.splice(i,1);
  }
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];r.t+=dt;
    if(r.t>=r.life)rings.splice(i,1);
  }
  for(let i=decals.length-1;i>=0;i--){
    const d=decals[i];
    d.heat=Math.max(0,d.heat-dt*1.6);
    d.a-=dt*0.09;
    if(d.a<=0)decals.splice(i,1);
  }
}
function updateAmb(dt,t){ // جزيئات الجو: خطوط رياح + ثلج
  if(amb.length>160)return;
  const fx=envForce();
  if(diff&&(diff.wind||diff.conveyor)&&Math.abs(fx)>60){
    if(Math.random()<dt*Math.min(26,Math.abs(fx)/28))
      amb.push({type:'streak',x:rand(playX,playX+playW),y:rand(80,H-20),vx:fx*1.35,vy:rand(-14,14),t:0,max:rand(0.5,0.9)});
  }
  if(diff&&diff.ice&&Math.random()<dt*8)
    amb.push({type:'snow',x:rand(0,W),y:-6,vy:rand(26,60),sway:rand(0.5,1.5),ph:rand(0,TAU),t:0,max:20});
  for(let i=amb.length-1;i>=0;i--){
    const a=amb[i];a.t+=dt;
    if(a.type==='streak'){a.x+=a.vx*dt;a.y+=a.vy*dt;if(a.t>a.max||a.x<-30||a.x>W+30)amb.splice(i,1);}
    else{a.y+=a.vy*dt;a.x+=Math.sin(t*1.5+a.ph)*12*dt;if(a.y>H+4||a.t>a.max)amb.splice(i,1);}
  }
}
function demoUpdate(dt){
  demoT-=dt;
  if(demoT<=0){demoT=rand(0.55,1.15);if(meteors.length<8)spawnMeteor();}
  for(const m of meteors)m.update(dt);
  sweep(meteors,m=>m.y>H+90||m.x<-90||m.x>W+90);
}
function updateLoops(){ // صوت الرياح والدوي المحيطي
  if(!actx||!windGain)return;
  let wv=0,rv=0;
  if(state==='playing'&&diff){
    const f=Math.abs(envForce());
    if(diff.wind)wv=f/3400;
    if(diff.conveyor)wv=Math.max(wv,f/5000);
    if(quakeState==='warn')rv=0.4;
  }
  windGain.gain.value=Math.min(0.16,wv);
  rumbleGain.gain.value=rv;
}
function update(dt){
  if(state==='paused')return;
  updateStars(dt);
  updateFX(dt);
  if(state==='menu'||state==='select'||state==='shop'){demoUpdate(dt);return;}
  if(state==='over'||state==='clear')return;
  if(state==='dying'){
    deathT-=dt;
    const dts=dt*0.32;
    for(const m of meteors)m.update(dts);
    for(const w of walls)w.update(dts);
    for(const l of lasers)l.update(dts);
    for(const h of holes)h.update(dts);
    for(const f of fakes)f.update(dts);
    for(const c of coins)c.update(dts);
    for(const b of bullets){b.x+=b.vx*dts;b.y+=b.vy*dts;}
    if(deathT<=0)showGameOver();
    return;
  }
  if(hitstop>0){hitstop-=dt;return;}
  playingUpdate(dt);
  updateAmb(dt,elapsed);
}

function drawMeteor(m){
  if(!m.active){
    const a=0.4+0.6*Math.abs(Math.sin(m.warn*14));
    ctx.globalAlpha=a;
    ctx.fillStyle='#ff8a3c';
    ctx.beginPath();ctx.moveTo(m.x-8,74);ctx.lineTo(m.x+8,74);ctx.lineTo(m.x,86);ctx.closePath();ctx.fill();
    ctx.globalAlpha=a*0.5;
    ctx.fillRect(m.x-1,88,2,26);
    ctx.globalAlpha=1;
    return;
  }
  // ظل واقعي على الأرض كل ما قرب الشهاب
  if(m.r>=12){
    const k=clamp((m.y/(H-40))-0.35,0,1);
    if(k>0){
      ctx.globalAlpha=k*0.25;ctx.fillStyle='#000';
      ctx.beginPath();ctx.ellipse(m.x,groundY-2,m.r*1.1*(0.5+k*0.5),m.r*0.22,0,0,TAU);ctx.fill();
      ctx.globalAlpha=1;
    }
  }
  const L=Math.hypot(m.vx,m.vy)||1,ux=m.vx/L,uy=m.vy/L;
  ctx.globalAlpha=0.28;ctx.fillStyle=m.home?'#ff6a9a':'#ff8a3c';
  circ(ctx,m.x-ux*m.r*1.6,m.y-uy*m.r*1.6,m.r*0.62);
  ctx.globalAlpha=0.14;circ(ctx,m.x-ux*m.r*2.7,m.y-uy*m.r*2.7,m.r*0.4);
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.rot);
  ctx.beginPath();
  const n=m.verts.length;
  for(let i=0;i<n;i++){
    const a=i/n*TAU,rr=m.r*m.verts[i];
    i?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);
  }
  ctx.closePath();
  ctx.fillStyle=m.home?'#d94f7c':'#ff5a3c';ctx.fill();
  ctx.lineWidth=1.8;ctx.strokeStyle='rgba(255,217,160,.9)';ctx.stroke();
  ctx.fillStyle='rgba(120,32,22,.85)';
  for(const c of m.cr)circ(ctx,Math.cos(c.a)*c.d*m.r,Math.sin(c.a)*c.d*m.r,c.s*m.r);
  ctx.restore();
}
function drawWall(w){
  for(const r of w.rects){
    if(r[2]<=0)continue;
    const x=r[0],y=r[1],ww=r[2],hh=r[3];
    ctx.fillStyle='#1c1430';ctx.fillRect(x,y,ww,hh);
    ctx.save();ctx.beginPath();ctx.rect(x,y,ww,hh);ctx.clip();
    ctx.strokeStyle='rgba(164,77,255,.18)';ctx.lineWidth=4;
    for(let sx=x-hh;sx<x+ww;sx+=18){
      ctx.beginPath();ctx.moveTo(sx,y+hh);ctx.lineTo(sx+hh,y);ctx.stroke();
    }
    ctx.fillStyle='rgba(164,77,255,.5)';
    for(let sx=x+7;sx<x+ww-4;sx+=26)circ(ctx,sx,y+hh/2,1.8);
    ctx.restore();
    ctx.fillStyle='#a44dff';
    ctx.fillRect(x,y,ww,2);ctx.fillRect(x,y+hh-2,ww,2);
    ctx.strokeStyle='#7d2fd0';ctx.lineWidth=1;ctx.strokeRect(x,y,ww,hh);
  }
  const gl=w.gapX-w.gapW/2,gr=w.gapX+w.gapW/2;
  const pul=0.6+0.4*Math.sin(w.phase*2);
  ctx.fillStyle='rgba(64,232,255,'+pul.toFixed(2)+')';
  ctx.fillRect(gl-3,w.y,3,w.h);ctx.fillRect(gr,w.y,3,w.h);
}
function tri(x,y){
  ctx.beginPath();ctx.moveTo(x-6,y-5);ctx.lineTo(x+6,y-5);ctx.lineTo(x,y+5);ctx.closePath();ctx.fill();
}
function drawLaser(l){
  if(l.state==='warn'){
    const a=0.25+0.45*Math.abs(Math.sin(l.t*9));
    ctx.save();
    ctx.setLineDash([9,11]);ctx.lineWidth=2;
    ctx.strokeStyle='rgba(255,70,95,'+a.toFixed(2)+')';
    ctx.beginPath();
    if(l.type==='h'){ctx.moveTo(playX,l.pos);ctx.lineTo(playX+playW,l.pos);}
    else{ctx.moveTo(l.pos,70);ctx.lineTo(l.pos,H);}
    ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,70,95,'+Math.min(1,a+0.2).toFixed(2)+')';
    if(l.type==='h'){tri(playX+8,l.pos);tri(playX+playW-8,l.pos);}
    else{tri(l.pos,80);tri(l.pos,H-8);}

    for(const L of layers){

      if(l.type==='h')ctx.fillRect(playX,l.pos-L[1],playW,L[1]*2);

    ctx.fillStyle='#ff8ba0';

function drawHole(h,t){

  ctx.save();ctx.translate(h.x,h.y);ctx.globalAlpha=Math.max(0,ap);
  ctx.fillStyle='rgba(157,92,255,.07)';circ(ctx,0,0,h.r*2.1);
  ctx.fillStyle='rgba(157,92,255,.12)';circ(ctx,0,0,h.r*1.35);
  ctx.fillStyle='#04030c';circ(ctx,0,0,h.r*0.75);
  ctx.lineWidth=3;ctx.strokeStyle='#9d5cff';
  ctx.beginPath();ctx.arc(0,0,h.r*0.75,0,TAU);ctx.stroke();

  for(let i=0;i<6;i++){

    circ(ctx,Math.cos(a)*rr,Math.sin(a)*rr,1.8);

function drawFZ(f,t){
  ctx.save();ctx.translate(f.x,f.y);
  if(f.state==='lure'){
    const p=0.5+0.5*Math.sin(t*3+f.x);

    ctx.lineWidth=2;ctx.strokeStyle='rgba(61,255,160,'+(0.45+0.3*p).toFixed(2)+')';
    ctx.beginPath();ctx.arc(0,0,f.r,0,TAU);ctx.stroke();
    ctx.fillStyle='rgba(61,255,160,'+(0.5+0.4*p).toFixed(2)+')';circ(ctx,0,0,3.5);
  }else if(f.state==='arm'){
    const p=Math.abs(Math.sin(f.t*22));

    ctx.beginPath();ctx.arc(0,0,f.r,0,TAU);ctx.stroke();
  }else if(f.state==='boom'){
    const k=f.t/f.boom,wr=f.waveR,a=1-k;

function drawCoin(c){

function drawPupIcon(g,kind,s){
  g.strokeStyle=g.fillStyle='#f2fbff';g.lineWidth=2;g.lineCap='round';g.lineJoin='round';
  switch(kind){
    case 'shield':
      g.beginPath();g.moveTo(0,-s);
      g.lineTo(s*0.8,-s*0.55);g.lineTo(s*0.8,s*0.1);
      g.quadraticCurveTo(s*0.8,s*0.7,0,s);
      g.quadraticCurveTo(-s*0.8,s*0.7,-s*0.8,s*0.1);
      g.lineTo(-s*0.8,-s*0.55);g.closePath();g.fill();break;
    case 'slow':
      g.beginPath();g.moveTo(0,-s);g.lineTo(0,s);g.moveTo(-s*0.87,-s*0.5);g.lineTo(s*0.87,s*0.5);
      g.moveTo(s*0.87,-s*0.5);g.lineTo(-s*0.87,s*0.5);g.stroke();break;
    case 'magnet':
      g.beginPath();g.moveTo(-s*0.55,-s*0.75);g.lineTo(-s*0.55,0);
      g.arc(0,0,s*0.55,Math.PI,0,true);g.lineTo(s*0.55,-s*0.75);g.stroke();break;
    case 'heart':
      g.beginPath();g.moveTo(0,s*0.9);
      g.bezierCurveTo(-s*1.3,0,-s*0.55,-s*0.9,0,-s*0.3);
      g.bezierCurveTo(s*0.55,-s*0.9,s*1.3,0,0,s*0.9);g.fill();break;
    case 'dash':
      g.beginPath();g.moveTo(s*0.25,-s);g.lineTo(-s*0.55,s*0.15);g.lineTo(0,s*0.15);
      g.lineTo(-s*0.25,s);g.lineTo(s*0.55,-s*0.15);g.lineTo(0,-s*0.15);g.closePath();g.fill();break;
  }
}

function drawTurret(tu,t){
  if(tu.alpha<=0)return;
  ctx.save();ctx.translate(tu.x,tu.y);
  ctx.globalAlpha=Math.max(0,tu.alpha);
  if(tu.state==='aim'||tu.state==='lock'){
    const ex=Math.cos(tu.a)*2000,ey=Math.sin(tu.a)*2000;
    if(tu.state==='aim'){
      ctx.setLineDash([4,10]);ctx.lineWidth=1;ctx.strokeStyle='rgba(255,80,110,.28)';
    }else{
      ctx.setLineDash([]);ctx.lineWidth=2;ctx.strokeStyle='rgba(255,80,110,.8)';
    }
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(ex,ey);ctx.stroke();ctx.setLineDash([]);
    if(tu.state==='lock'){
      const p=0.5+0.5*Math.sin(t*30);
      ctx.strokeStyle='rgba(255,80,110,'+(0.3+0.5*p).toFixed(2)+')';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(0,0,20+4*p,0,TAU);ctx.stroke();
    }
  }
  ctx.save();ctx.rotate(tu.a);
  ctx.fillStyle='#243b55';ctx.fillRect(6,-3.5,17,7);
  ctx.fillStyle='#ff5a7a';ctx.fillRect(20,-2,4,4);
  ctx.restore();
  ctx.fillStyle='#1a2740';
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=i/6*TAU+Math.PI/6,px=Math.cos(a)*13,py=Math.sin(a)*13;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath();ctx.fill();
  ctx.lineWidth=1.6;ctx.strokeStyle='#4f6a99';ctx.stroke();
  ctx.fillStyle='#ff3860';circ(ctx,0,0,4.5);
  ctx.fillStyle='#2b0416';circ(ctx,Math.cos(tu.a)*2,Math.sin(tu.a)*2,2);
  ctx.restore();
  ctx.globalAlpha=1;
}
function drawOrbit(o){
  ctx.save();
  ctx.strokeStyle='rgba(194,100,255,.18)';ctx.lineWidth=1.2;ctx.setLineDash([3,7]);
  ctx.beginPath();ctx.arc(o.cx,o.cy,o.r,0,TAU);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(194,100,255,.5)';circ(ctx,o.cx,o.cy,2.5);
  for(let i=0;i<o.n;i++){
    const p=o.pos(i),c=o.chunks[i];
    ctx.save();ctx.translate(p[0],p[1]);ctx.rotate(c.rot);
    ctx.beginPath();
    for(let k=0;k<6;k++){
      const a=k/6*TAU,rr=c.r*(0.75+0.4*Math.sin(k*2.7+i));
      k?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);
    }
    ctx.closePath();
    ctx.fillStyle='#8b6bd6';ctx.fill();
    ctx.lineWidth=1.4;ctx.strokeStyle='rgba(220,200,255,.7)';ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}
function drawBullets(){
  for(const b of bullets){
    ctx.fillStyle='rgba(255,56,96,.25)';circ(ctx,b.x,b.y,b.r+5);
    ctx.fillStyle='#ff5a7a';circ(ctx,b.x,b.y,b.r);
    ctx.fillStyle='rgba(255,255,255,.85)';circ(ctx,b.x-2,b.y-2,b.r*0.32);
  }
}
function drawBeam(x,y,a,len,t){
  const ex=x+Math.cos(a)*len,ey=y+Math.sin(a)*len;
  const layers=[['rgba(255,45,74,.18)',26],['rgba(255,45,74,.5)',10],['rgba(255,255,255,.9)',3]];
  for(const L of layers){
    ctx.lineWidth=L[1];ctx.strokeStyle=L[0];
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(ex,ey);ctx.stroke();
  }
  ctx.fillStyle='rgba(255,120,140,.6)';circ(ctx,ex,ey,7);
  const g=ctx.createRadialGradient(x,y,2,x,y,26);
  g.addColorStop(0,'rgba(255,200,120,.9)');g.addColorStop(1,'rgba(255,80,80,0)');
  ctx.fillStyle=g;circ(ctx,x,y,26);
}
function drawBoss(t){
  const b=boss;
  ctx.save();
  ctx.translate(b.x,b.y);
  const fade=b.dead?Math.max(0,1-b.deathT/1.7):1;
  ctx.globalAlpha=fade;
  if(b.dead){const s=1+b.deathT*0.22;ctx.scale(s,s);}
  else if(b.flash>0)ctx.translate(rand(-3,3),rand(-3,3));
  const type=b.type,coreR=b.coreR;
  const pul=0.5+0.5*Math.sin(t*3);
  const ac=type==='hive'?'255,90,200':type==='sentinel'?'120,180,255':type==='core'?'255,180,60':'255,56,96';
  const g=ctx.createRadialGradient(0,0,10,0,0,coreR*3);
  g.addColorStop(0,'rgba('+ac+','+(0.10+0.06*pul).toFixed(2)+')');
  g.addColorStop(1,'rgba('+ac+',0)');
  ctx.fillStyle=g;circ(ctx,0,0,coreR*3);
  const nArc=type==='warden'?3:type==='hive'?4:type==='core'?4:2;
  const arcCol=type==='sentinel'?'#7fa8d9':type==='core'?'#ffb84d':'#ff3860';
  for(let i=0;i<nArc;i++){
    const dir=i%2?-1:1,a0=t*(0.5+i*0.3)*dir+i*(TAU/nArc);
    const rr=coreR+10+i*7;
    ctx.lineWidth=8;ctx.strokeStyle='rgba(20,10,30,.9)';
    ctx.beginPath();ctx.arc(0,0,rr,a0,a0+TAU/nArc*0.62);ctx.stroke();
    ctx.lineWidth=2.2;ctx.strokeStyle=arcCol;
    ctx.beginPath();ctx.arc(0,0,rr,a0,a0+TAU/nArc*0.62);ctx.stroke();
  }
  ctx.fillStyle='#12060f';circ(ctx,0,0,coreR);
  ctx.lineWidth=2.5;ctx.strokeStyle=arcCol;
  ctx.beginPath();ctx.arc(0,0,coreR,0,TAU);ctx.stroke();
  if(b.state==='open'&&!b.dead){
    const op=0.7+0.3*Math.sin(t*8);
    const g2=ctx.createRadialGradient(0,0,2,0,0,coreR*0.95);
    g2.addColorStop(0,'rgba(255,245,190,'+op.toFixed(2)+')');
    g2.addColorStop(0.6,'rgba(255,205,90,'+(op*0.85).toFixed(2)+')');
    g2.addColorStop(1,'rgba(255,160,40,0)');
    ctx.fillStyle=g2;circ(ctx,0,0,coreR*0.95);
    ctx.fillStyle='#fff2c0';circ(ctx,0,0,coreR*0.42);
    ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.5;
    ctx.setLineDash([6,5]);ctx.lineDashOffset=-t*40;
    ctx.beginPath();ctx.arc(0,0,coreR*0.72,0,TAU);ctx.stroke();ctx.setLineDash([]);
  }else{
    ctx.fillStyle='#321040';
    for(let i=0;i<6;i++){
      const a=t*0.8+i*TAU/6;
      ctx.save();ctx.rotate(a);
      ctx.beginPath();
      ctx.moveTo(coreR*0.3,-coreR*0.26);ctx.lineTo(coreR*0.95,-coreR*0.4);
      ctx.lineTo(coreR*0.95,coreR*0.4);ctx.lineTo(coreR*0.3,coreR*0.26);
      ctx.closePath();ctx.fill();
      ctx.restore();
    }
    const ex=clamp((player.x-b.x)*0.03,-7,7),ey=clamp((player.y-b.y)*0.03,-5,6);
    ctx.fillStyle=arcCol;circ(ctx,ex,ey,8);
    ctx.fillStyle='#1a0410';circ(ctx,ex,ey,3.6);
  }
  if(b.flash>0){ctx.globalAlpha=b.flash*fade;ctx.fillStyle='#fff';circ(ctx,0,0,coreR);ctx.globalAlpha=fade;}
  ctx.restore();
  if(b.sweep){
    const s=b.sweep;
    if(s.phase==='tel'){
      ctx.save();ctx.setLineDash([8,10]);ctx.lineWidth=2;
      ctx.strokeStyle='rgba(120,180,255,'+(0.3+0.3*Math.sin(t*16)).toFixed(2)+')';
      const ex2=b.x+Math.cos(s.a)*1400,ey2=b.y+Math.sin(s.a)*1400;
      ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(ex2,ey2);ctx.stroke();
      ctx.setLineDash([]);ctx.restore();
    }else drawBeam(b.x,b.y,s.a,1400,t);
  }
  if(b.type==='core'&&b.beamOn&&!b.dead){
    drawBeam(b.x,b.y,b.beamA,1400,t);
    drawBeam(b.x,b.y,b.beamA+Math.PI,1400,t);
  }
  if(!b.dead){
    const bw=Math.min(250,playW-70),bx=W/2-bw/2,by=104;
    ctx.font='700 10px "Chakra Petch",sans-serif';ctx.textAlign='center';
    ctx.fillStyle='rgba(255,150,170,.9)';
    ctx.fillText(type==='warden'?'THE WARDEN':type==='sentinel'?'THE SENTINEL':type==='hive'?'THE HIVE':'THE CORE',W/2,by-5);
    ctx.fillStyle='rgba(10,6,16,.8)';ctx.fillRect(bx,by,bw,8);
    const seg=bw/b.maxHp;
    for(let i=0;i<b.maxHp;i++){
      ctx.fillStyle=i<b.hp?'#ff3860':'rgba(255,56,96,.15)';
      ctx.fillRect(bx+i*seg+1.5,by+1.5,seg-3,5);
    }
    ctx.strokeStyle='rgba(255,56,96,.6)';ctx.lineWidth=1;ctx.strokeRect(bx-0.5,by-0.5,bw+1,9);
  }
}
function drawPlayer(t){
  const len=player.dashT>0?14:9;
  for(let i=1;i<=len;i++){
    const p=player.trail[i];
    if(!p)break;
    const k=1-i/len;
    ctx.globalAlpha=k*0.22;
    ctx.fillStyle=CHARCOL[charId]||'#35e6ff';
    circ(ctx,p.x,p.y,player.r*k*0.8);
  }
  ctx.globalAlpha=1;
  const vl=Math.hypot(player.vx,player.vy)||1;
  const lx=clamp(player.vx/vl,-1,1),ly=clamp(player.vy/vl,-1,1);
  const tilt=clamp(player.vx*0.0009,-0.4,0.4);
  const bob=Math.sin(t*4)*1.6;
  ctx.save();
  ctx.translate(player.x,player.y+bob);ctx.rotate(tilt);
  const st=clamp(Math.abs(player.vy)/2600,0,0.12);
  ctx.scale(1-st*0.7,1+st);
  if(player.invuln>0&&Math.sin(player.invuln*30)>0)ctx.globalAlpha=0.3;
  drawChar(ctx,charId,player.r,t,lx,ly);
  ctx.globalAlpha=1;
  if(player.shield){
    ctx.setLineDash([9,6]);ctx.lineDashOffset=-t*30;
    ctx.lineWidth=2;ctx.strokeStyle='rgba(125,243,255,.85)';
    ctx.beginPath();ctx.arc(0,0,player.r+11+Math.sin(t*5)*1.5,0,TAU);ctx.stroke();
    ctx.setLineDash([]);
  }
  if(player.magnetT>0){
    ctx.setLineDash([3,10]);ctx.lineDashOffset=t*22;
    ctx.lineWidth=1.5;ctx.strokeStyle='rgba(255,159,208,.4)';
    ctx.beginPath();ctx.arc(0,0,player.r+20,0,TAU);ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}
function drawBG(t){
  ctx.fillStyle='#05070f';ctx.fillRect(0,0,W,H);
  for(const n of nebulas){
    const nx=n.x+Math.sin(t*n.sp+n.ph)*40,ny=n.y+Math.cos(t*n.sp*0.8+n.ph)*30;
    const g=ctx.createRadialGradient(nx,ny,0,nx,ny,n.r);
    g.addColorStop(0,n.c);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;circ(ctx,nx,ny,n.r);
  }
  for(const s of stars){
    const a=(0.22+s.z*0.55)*(0.75+0.25*Math.sin(t*3+s.ph));
    ctx.globalAlpha=a;
    ctx.fillStyle=s.z>0.6?'#cfe0ff':'#88a8e8';
    circ(ctx,s.x,s.y,0.8+s.z*1.8);
  }
  ctx.globalAlpha=1;
}
function drawGround(){
  const icy=diff&&diff.ice;
  ctx.strokeStyle=icy?'rgba(140,220,255,.5)':'rgba(90,130,180,.3)';
  ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(playX,groundY);ctx.lineTo(playX+playW,groundY);ctx.stroke();
  ctx.strokeStyle=icy?'rgba(140,220,255,.14)':'rgba(90,130,180,.14)';
  ctx.lineWidth=1;
  for(let x=playX+10;x<playX+playW;x+=26){
    ctx.beginPath();ctx.moveTo(x,groundY);ctx.lineTo(x-6,groundY+7);ctx.stroke();
  }
}
function drawDecals(){
  for(const d of decals){
    ctx.globalAlpha=Math.min(1,d.a);
    ctx.fillStyle='rgba(10,8,6,.55)';
    ctx.beginPath();ctx.ellipse(d.x,groundY,d.r,d.r*0.26,0,0,TAU);ctx.fill();
    if(d.heat>0){
      ctx.strokeStyle='rgba(255,120,50,'+(d.heat*0.8).toFixed(2)+')';
      ctx.lineWidth=1.5;
      ctx.beginPath();ctx.ellipse(d.x,groundY,d.r*0.9,d.r*0.23,0,0,TAU);ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
}
function drawRings(){
  for(const r of rings){
    const k=r.t/r.life;
    ctx.strokeStyle='rgba(255,190,140,'+(1-k).toFixed(2)+')';
    ctx.lineWidth=3*(1-k)+1;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r+(r.max-r.r)*k,0,TAU);ctx.stroke();
  }
}
function drawFog(){
  for(const f of fogs){
    const g=ctx.createRadialGradient(f.x,f.y,f.r*0.15,f.x,f.y,f.r);
    g.addColorStop(0,'rgba(6,10,22,.92)');
    g.addColorStop(0.7,'rgba(6,10,22,.7)');
    g.addColorStop(1,'rgba(6,10,22,0)');
    ctx.fillStyle=g;circ(ctx,f.x,f.y,f.r);
  }
  if(state==='playing'){
    ctx.globalAlpha=.3;ctx.strokeStyle='#7df7ff';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(player.x,player.y,7,0,TAU);ctx.stroke();
    ctx.globalAlpha=1;
  }
}
function drawDark(t){
  const d=diff.dark;
  darkCtx.setTransform(1,0,0,1,0,0);
  darkCtx.clearRect(0,0,W,H);
  darkCtx.globalCompositeOperation='source-over';
  darkCtx.fillStyle='rgba(1,3,9,.94)';
  darkCtx.fillRect(0,0,W,H);
  darkCtx.globalCompositeOperation='destination-out';
  const hole=(x,y,r,a)=>{
    const g=darkCtx.createRadialGradient(x,y,r*0.2,x,y,r);
    g.addColorStop(0,'rgba(0,0,0,'+a+')');
    g.addColorStop(1,'rgba(0,0,0,0)');
    darkCtx.fillStyle=g;
    darkCtx.beginPath();darkCtx.arc(x,y,r,0,TAU);darkCtx.fill();
  };
  hole(player.x,player.y,d.r*(1+0.05*Math.sin(t*5)),1);
  hole(exitX,150,70,0.9);
  for(const c of coins)hole(c.x,c.y,26,0.7);
  for(const p of pups)hole(p.x,p.y,30,0.75);
  for(const b of bullets)hole(b.x,b.y,14,0.6);
  for(const l of lasers){
    if(l.type==='h')for(let x=playX;x<playX+playW;x+=70)hole(x,l.pos,18,0.55);
    else for(let y=80;y<H;y+=70)hole(l.pos,y,18,0.55);
  }
  if(boss)hole(boss.x,boss.y,90,0.8);
  darkCtx.globalCompositeOperation='source-over';
  ctx.drawImage(darkCv,0,0,W,H);
}
function drawAmb(t){
  for(const a of amb){
    if(a.type==='streak'){
      ctx.globalAlpha=.18;ctx.strokeStyle='#9fd0ff';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(a.x,a.y);
      ctx.lineTo(a.x-a.vx*0.05,a.y-a.vy*0.05);ctx.stroke();
    }else{
      ctx.globalAlpha=.5;ctx.fillStyle='#eaf6ff';
      circ(ctx,a.x,a.y,1.4);
    }
  }
  ctx.globalAlpha=1;
}
function drawFlow(t){
  if(!diff||state!=='playing')return;
  if(diff.conveyor){
    const warn=conv.warn>0;
    ctx.save();
    ctx.beginPath();ctx.rect(playX,70,playW,H-90);ctx.clip();
    const sp=150*conv.dir*(warn?0.25:1);
    ctx.lineWidth=2;
    for(let y=120;y<H-40;y+=92){
      for(let k=-1;k<playW/90+1;k++){
        const x=playX+(((k*90+t*sp)%playW)+playW)%playW;
        ctx.strokeStyle=warn?'rgba(255,90,90,.16)':'rgba(120,200,255,.10)';
        ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+26,y);ctx.stroke();
      }
    }
    ctx.restore();
    const cy=H*0.45;
    const blink=warn?Math.abs(Math.sin(t*10)):1;
    ctx.strokeStyle=warn?'rgba(255,90,90,'+(0.6*blink).toFixed(2)+')':'rgba(120,200,255,.4)';
    ctx.lineWidth=3;ctx.lineCap='round';
    for(const ex of [playX+16,playX+playW-16]){
      const s=ex<playX+playW/2?conv.dir*(warn?0:1):-conv.dir*(warn?0:1);
      ctx.beginPath();
      ctx.moveTo(ex-10*s,cy-9);ctx.lineTo(ex+10*s,cy);ctx.lineTo(ex-10*s,cy+9);
      ctx.stroke();
    }
    if(warn){
      ctx.font='700 11px "Chakra Petch",sans-serif';ctx.textAlign='center';
      ctx.fillStyle='rgba(255,90,90,'+blink.toFixed(2)+')';
      ctx.fillText('REVERSING',W/2,cy-16);
    }
  }
}
function render(t){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawBG(t);
  ctx.save();
  if(shake>0.2)ctx.translate(rand(-shake,shake),rand(-shake,shake));
  if(playX>2){
    ctx.fillStyle='rgba(2,4,10,.55)';
    ctx.fillRect(0,0,playX,H);ctx.fillRect(playX+playW,0,W-playX-playW,H);
  }
  ctx.strokeStyle='rgba(64,232,255,.16)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(playX+0.5,60);ctx.lineTo(playX+0.5,H);
  ctx.moveTo(playX+playW-0.5,60);ctx.lineTo(playX+playW-0.5,H);ctx.stroke();
  drawGround();
  drawDecals();
  for(const f of fakes)drawFZ(f,t);
  for(const c of coins)drawCoin(c);
  for(const p of pups)drawPup(p,t);
  for(const w of walls)drawWall(w);
  for(const m of meteors)drawMeteor(m);
  for(const h of holes)drawHole(h,t);
  for(const s of shards)drawShard(s);
  for(const o of orbits)drawOrbit(o);
  for(const l of lasers)drawLaser(l);
  for(const tu of turrets)drawTurret(tu,t);
  drawBullets();
  if(boss)drawBoss(t);
  if(state==='playing')drawPlayer(t);
  for(const p of parts){
    const k=1-p.t/p.life;
    ctx.globalAlpha=k;ctx.fillStyle=p.color;
    circ(ctx,p.x,p.y,Math.max(0.4,p.size*k));
  }
  ctx.globalAlpha=1;
  drawRings();
  for(const tx of texts){
    const k=1-tx.t/tx.life;
    ctx.globalAlpha=Math.min(1,k*2);
    ctx.font='700 '+tx.size+'px "Chakra Petch",sans-serif';
    ctx.textAlign='center';
    ctx.lineWidth=3;ctx.strokeStyle='rgba(3,6,14,.8)';
    ctx.strokeText(tx.txt,tx.x,tx.y);
    ctx.fillStyle=tx.color;ctx.fillText(tx.txt,tx.x,tx.y);
  }
  ctx.globalAlpha=1;
  drawFog();
  if(mode==='campaign'&&diff&&!diff.boss&&state!=='menu'&&state!=='select'&&state!=='shop')drawExit(t);
  if(diff&&diff.dark&&(state==='playing'||state==='dying'))drawDark(t);
  drawAmb(t);
  drawFlow(t);
  ctx.restore();
  if(joy.active&&state==='playing'){
    ctx.lineWidth=2;
    ctx.strokeStyle='rgba(64,232,255,.3)';
    ctx.beginPath();ctx.arc(joy.bx,joy.by,joy.r,0,TAU);ctx.stroke();
    ctx.fillStyle='rgba(64,232,255,.08)';
    ctx.beginPath();ctx.arc(joy.bx,joy.by,joy.r,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(64,232,255,.55)';
    circ(ctx,joy.bx+joy.dx,joy.by+joy.dy,18);
  }
}

function heartSVG(cls){return '<svg class="h '+cls+'" viewBox="0 0 24 24"><path d="'+HEART_PATH+'"/></svg>';}
function renderHearts(){
